<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoSafari Go — Painel da Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0a0e0c;
    --bg-2: #0d1210;
    --card: #141918;
    --card-border: #1f2624;
    --green: #1fdf9a;
    --green-dim: rgba(31,223,154,0.12);
    --blue: #5aa9e6;
    --amber: #f5b942;
    --amber-dim: rgba(245,185,66,0.12);
    --danger: #ff6b6b;
    --text: #eef2f0;
    --text-dim: #8b9994;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text); -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand-font{font-family:'Fraunces',serif;}
  a{color:inherit;}
  ::selection{background:var(--green); color:#04140d;}

  /* ---------- LOGIN ---------- */
  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:100%; max-width:380px; background:var(--card); border:1px solid var(--card-border); border-radius:20px; padding:36px 32px;}
  .login-logo{text-align:center; margin-bottom:28px;}
  .login-logo .circle{width:52px; height:52px; border-radius:50%; border:2.5px solid var(--green); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 12px auto;}
  .login-logo h1{font-size:19px; margin:0; color:var(--text);}
  .login-logo p{font-size:12px; color:var(--text-dim); margin:6px 0 0 0;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; font-weight:600; letter-spacing:0.03em;}
  .field input{width:100%; background:var(--bg-2); border:1px solid var(--card-border); border-radius:10px; padding:12px 13px; color:var(--text); font-size:13.5px; outline:none; font-family:inherit;}
  .field input:focus{border-color:var(--green);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--green); color:#04140d; border:none; border-radius:10px; padding:12px 18px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;}
  .btn:disabled{opacity:0.5; cursor:default;}
  .btn.full{width:100%;}
  .btn-ghost{background:transparent; border:1px solid var(--card-border); color:var(--text-dim);}
  .error-msg{color:var(--danger); font-size:12px; margin:-4px 0 12px 0; min-height:14px;}

  /* ---------- APP SHELL ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:240px; flex-shrink:0; background:var(--bg-2); border-right:1px solid var(--card-border); padding:22px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .sidebar-brand{display:flex; align-items:center; gap:9px; padding:0 8px 20px 8px; font-weight:700; color:var(--green); font-size:15px;}
  .sidebar-brand .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--green); display:flex;align-items:center;justify-content:center; font-size:11px; flex-shrink:0;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:2px; transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,0.03);}
  .nav-item.active{background:var(--green-dim); color:var(--green);}
  .nav-item svg{width:17px;height:17px; flex-shrink:0;}
  .sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid var(--card-border);}
  .sidebar-user{font-size:11.5px; color:var(--text-dim); padding:0 8px 10px 8px; word-break:break-all;}

  .main{flex:1; min-width:0; padding:26px 32px 60px 32px;}
  .main-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .main-header h1{font-size:22px; margin:0;}
  .main-header p{color:var(--text-dim); font-size:12.5px; margin:4px 0 0 0;}

  .date-range{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:8px 12px;}
  .date-range input{background:transparent; border:none; color:var(--text); font-size:12.5px; font-family:inherit; outline:none;}
  .date-range span{color:var(--text-dim); font-size:11px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; margin-bottom:28px;}
  .kpi-card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:18px;}
  .kpi-card .val{font-size:26px; font-weight:800; color:var(--green); font-family:'Fraunces',serif;}
  .kpi-card .lbl{font-size:11.5px; color:var(--text-dim); margin-top:4px; text-transform:uppercase; letter-spacing:0.03em;}
  .kpi-card.amber .val{color:var(--amber);}
  .kpi-card.blue .val{color:var(--blue);}

  .panel{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px; margin-bottom:22px;}
  .panel-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-dim); margin:0 0 16px 0; display:flex; justify-content:space-between; align-items:center;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; color:var(--text-dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; padding:8px 10px; border-bottom:1px solid var(--card-border);}
  td{padding:10px; border-bottom:1px solid var(--card-border); color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700;}
  .tag.free{background:rgba(139,153,148,0.15); color:var(--text-dim);}
  .tag.pro{background:var(--green-dim); color:var(--green);}
  .tag.premium{background:var(--amber-dim); color:var(--amber);}

  .chart-wrap{position:relative; height:260px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width: 900px){ .grid-2{grid-template-columns:1fr;} .sidebar{position:fixed; z-index:20; transform:translateX(-100%); transition:transform .2s;} .sidebar.open{transform:translateX(0);} .main{padding:20px;} }

  .empty-state{text-align:center; color:var(--text-dim); font-size:12.5px; padding:30px 10px;}
  .loading{text-align:center; color:var(--text-dim); font-size:12.5px; padding:40px;}
  .screen{display:none;}
  .screen.active{display:block;}

  a.btn, button.btn{text-decoration:none;}
  input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.6);}
</style>
</head>
<body>

<div id="root"></div>

<script>
/* =====================================================================
   CONEXÃO COM O SUPABASE (mesmo projeto do app — troque pelos seus dados)
   ===================================================================== */
const SUPABASE_URL = 'https://wahmsrsnastxtqrxuufp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhaG1zcnNuYXN0eHRxcnh1dWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTY3NDUsImV4cCI6MjA5OTczMjc0NX0.FvZdVGkwt76s2cMjvap1gvRJx8awHUonGXpPwb8gbpk';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
  session: null,
  isPlatformAdmin: false,
  screen: 'overview',
  dateFrom: new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10),
  dateTo: new Date().toISOString().slice(0,10),
  data: {},
  charts: {},
  chatMessages: [],
  chatLoading: false,
};

const AI_ASSISTANT_URL = SUPABASE_URL + '/functions/v1/platform-ai-assistant';

const root = document.getElementById('root');

function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function unesc(v){ return String(v == null ? '' : v).replace(/&(amp|lt|gt|quot|#39);/g, (m,k)=>({amp:'&',lt:'<',gt:'>',quot:'"','#39':"'"}[k])); }
/* Escapa todo texto vindo do banco antes de ir para a tela (nomes de
   pousadas, e-mails, espécies etc. são digitados por terceiros). */
function deepEsc(v){
  if(Array.isArray(v)) return v.map(deepEsc);
  if(v && typeof v === 'object'){ const o = {}; for(const k in v) o[k] = deepEsc(v[k]); return o; }
  return typeof v === 'string' ? esc(v) : v;
}
function fmtNum(n){ return (n||0).toLocaleString('pt-BR'); }
function fmtMoney(n){ return (n||0).toLocaleString('pt-BR', {style:'currency', currency:'USD'}); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('pt-BR') : '—'; }
function planTag(code){
  const cls = code === 'premium' ? 'premium' : (code === 'pro' ? 'pro' : 'free');
  const label = code === 'premium' ? 'Premium' : (code === 'pro' ? 'Pro' : 'Free');
  return `<span class="tag ${cls}">${label}</span>`;
}

/* =====================================================================
   LOGIN
   ===================================================================== */
function renderLogin(){
  root.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <div class="login-logo">
          <div class="circle">🌿</div>
          <h1>Painel da Plataforma</h1>
          <p>Acesso restrito — administração EcoSafari Go</p>
        </div>
        <div class="field"><label>E-MAIL</label><input id="lg-email" type="email" placeholder="seuemail@ecosafarigo.com"></div>
        <div class="field"><label>SENHA</label><input id="lg-pass" type="password" placeholder="••••••••"></div>
        <div class="error-msg" id="lg-error"></div>
        <button class="btn full" id="lg-btn">Entrar</button>
      </div>
    </div>
  `;
  document.getElementById('lg-btn').onclick = async ()=>{
    const email = document.getElementById('lg-email').value.trim();
    const pass = document.getElementById('lg-pass').value;
    const errBox = document.getElementById('lg-error');
    errBox.textContent = '';
    if(!email || !pass){ errBox.textContent = 'Preencha e-mail e senha.'; return; }

    const btn = document.getElementById('lg-btn');
    btn.disabled = true; btn.textContent = 'Entrando...';
    const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
    btn.disabled = false; btn.textContent = 'Entrar';

    if(error){
      console.error('Erro de login:', error.message);
      if(/failed to fetch|network/i.test(error.message)){
        errBox.textContent = 'Não foi possível conectar ao Supabase. Verifique a URL/chave no topo do arquivo.';
      } else if(/email not confirmed/i.test(error.message)){
        errBox.textContent = 'E-mail ainda não confirmado.';
      } else {
        errBox.textContent = 'E-mail ou senha inválidos. (' + error.message + ')';
      }
      return;
    }
    await completeLogin(data.session);
  };
}

async function completeLogin(session){
  state.session = session;
  const { data: adminRow } = await db.from('platform_admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if(!adminRow){
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-card" style="text-align:center;">
          <div style="font-size:32px; margin-bottom:10px;">🔒</div>
          <h1 style="font-size:16px;">Acesso não autorizado</h1>
          <p style="color:var(--text-dim); font-size:12.5px; margin-top:8px;">Esta conta não tem permissão para ver o painel da plataforma.</p>
          <button class="btn-ghost btn full" style="margin-top:20px;" onclick="logout()">Sair</button>
        </div>
      </div>
    `;
    return;
  }
  state.isPlatformAdmin = true;

  // Verificação em duas etapas
  try{
    const { data: aal } = await db.auth.mfa.getAuthenticatorAssuranceLevel();
    const { data: st } = await db.from('platform_settings').select('value').eq('key','staff_mfa_required').maybeSingle();
    const required = st && st.value === 'true';
    if(aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2'){ renderMfaChallenge(); return; }
    if(required && (!aal || aal.currentLevel !== 'aal2')){
      root.innerHTML = `<div class="login-screen"><div class="login-card" style="text-align:center;">
        <div style="font-size:32px; margin-bottom:10px;">🔐</div><h1 style="font-size:16px;">Ative a verificação em duas etapas</h1>
        <p style="color:var(--text-dim); font-size:12.5px; margin-top:8px;">O painel da plataforma exige 2FA. Entre no app EcoSafari Go com esta conta, vá em Perfil › Segurança › Verificação em duas etapas, e depois volte aqui.</p>
        <button class="btn-ghost btn full" style="margin-top:20px;" onclick="logout()">Sair</button></div></div>`;
      return;
    }
  }catch(_){}

  await loadAllData();
  renderShell();
}

function renderMfaChallenge(){
  root.innerHTML = `<div class="login-screen"><div class="login-card">
    <div class="login-logo"><div class="circle">🔐</div><h1>Verificação em duas etapas</h1><p>Digite o código de 6 dígitos do seu app autenticador.</p></div>
    <div class="field"><label>CÓDIGO</label><input id="mfa-code" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:6px; text-align:center; font-size:18px;"></div>
    <div class="error-msg" id="mfa-error"></div>
    <button class="btn full" id="mfa-btn">Confirmar</button>
    <button class="btn-ghost btn full" style="margin-top:8px;" onclick="logout()">Sair</button></div></div>`;
  const go = async ()=>{
    const code = document.getElementById('mfa-code').value.trim();
    const { data } = await db.auth.mfa.listFactors();
    const f = (data && data.totp || []).find(x => x.status === 'verified');
    if(!f){ document.getElementById('mfa-error').textContent = 'Nenhum autenticador cadastrado.'; return; }
    const { error } = await db.auth.mfa.challengeAndVerify({ factorId: f.id, code });
    if(error){ document.getElementById('mfa-error').textContent = 'Código incorreto ou expirado.'; return; }
    const { data: sess } = await db.auth.getSession();
    state.session = sess.session;
    await loadAllData(); renderShell();
  };
  document.getElementById('mfa-btn').onclick = go;
  document.getElementById('mfa-code').onkeydown = e => { if(e.key === 'Enter') go(); };
}

async function logout(){
  await db.auth.signOut();
  state.session = null;
  state.isPlatformAdmin = false;
  renderLogin();
}

/* =====================================================================
   ESTRUTURA PRINCIPAL (barra lateral + navegação)
   ===================================================================== */
const NAV_ITEMS = [
  { key:'overview', label:'Visão Geral', icon:'📊' },
  { key:'assistant', label:'Assistente IA', icon:'✨' },
  { key:'lodges', label:'Pousadas', icon:'🏡' },
  { key:'guests', label:'Hóspedes', icon:'👤' },
  { key:'species', label:'Espécies', icon:'🐆' },
  { key:'coin', label:'JaguarCoin', icon:'🪙' },
  { key:'financial', label:'Financeiro', icon:'💰' },
  { key:'health', label:'Saúde da Base', icon:'⚕️' },
  { key:'site', label:'Site Institucional', icon:'🌐' },
  { key:'audit', label:'Auditoria', icon:'🛡️' },
];

function renderShell(){
  root.innerHTML = `
    <div class="shell">
      <div class="sidebar">
        <div class="sidebar-brand"><span class="dot">🌿</span> EcoSafari Go</div>
        ${NAV_ITEMS.map(item => `
          <div class="nav-item ${state.screen===item.key?'active':''}" onclick="setScreen('${item.key}')">
            <span>${item.icon}</span> ${item.label}
          </div>
        `).join('')}
        <div class="sidebar-footer">
          <div class="sidebar-user">${state.session.user.email}</div>
          <button class="btn-ghost btn full" onclick="logout()">Sair</button>
        </div>
      </div>
      <div class="main" id="main"></div>
    </div>
  `;
  renderScreen();
}

function setScreen(key){
  state.screen = key;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  renderShell();
}

function renderScreen(){
  const main = document.getElementById('main');
  if(state.screen === 'overview') main.innerHTML = viewOverview();
  else if(state.screen === 'assistant') { main.innerHTML = viewAssistant(); bindAssistant(); return; }
  else if(state.screen === 'lodges') main.innerHTML = viewLodges();
  else if(state.screen === 'guests') main.innerHTML = viewGuests();
  else if(state.screen === 'species') main.innerHTML = viewSpecies();
  else if(state.screen === 'coin') main.innerHTML = viewCoin();
  else if(state.screen === 'financial') main.innerHTML = viewFinancial();
  else if(state.screen === 'health') main.innerHTML = viewHealth();
  else if(state.screen === 'site') main.innerHTML = viewSite();
  else if(state.screen === 'audit') main.innerHTML = viewAudit();
  bindScreenCharts();
}

/* =====================================================================
   VISÃO GERAL
   ===================================================================== */
function viewOverview(){
  const d = state.data;
  const totalLodges = d.lodges.length;
  const lodgesInRange = d.lodges.filter(l => l.created_at >= state.dateFrom && l.created_at <= state.dateTo + 'T23:59:59').length;
  const paidSubs = d.lodges.filter(l => l.plan_code !== 'free').length;

  return `
    <div class="main-header">
      <div>
        <h1>Visão Geral</h1>
        <p>Panorama de toda a plataforma EcoSafari Go</p>
      </div>
      <div class="date-range">
        <input type="date" id="date-from" value="${state.dateFrom}"> <span>até</span> <input type="date" id="date-to" value="${state.dateTo}">
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card"><div class="val">${fmtNum(totalLodges)}</div><div class="lbl">Pousadas cadastradas</div></div>
      <div class="kpi-card blue"><div class="val">${fmtNum(lodgesInRange)}</div><div class="lbl">Novas no período</div></div>
      <div class="kpi-card amber"><div class="val">${fmtNum(paidSubs)}</div><div class="lbl">Assinantes pagos</div></div>
      <div class="kpi-card"><div class="val">${fmtNum(d.coinEconomy.em_circulacao)}</div><div class="lbl">JaguarCoin em circulação</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">Pousadas com mais publicações</div>
        <div class="chart-wrap"><canvas id="chart-top-posts"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-title">Hóspedes por país</div>
        <div class="chart-wrap"><canvas id="chart-countries"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Pousadas cadastradas recentemente</div>
      ${d.lodges.length===0 ? '<div class="empty-state">Nenhuma pousada cadastrada ainda.</div>' : `
      <table>
        <thead><tr><th>Pousada</th><th>Plano</th><th>Cadastrada em</th><th>Avistamentos</th><th>Hóspedes</th></tr></thead>
        <tbody>
          ${d.lodges.slice(0,8).map(l=>`
            <tr>
              <td>${l.name}</td>
              <td>${planTag(l.plan_code)}</td>
              <td>${fmtDate(l.created_at)}</td>
              <td>${fmtNum(l.total_avistamentos)}</td>
              <td>${fmtNum(l.total_hospedes_ativos)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      `}
    </div>
  `;
}

async function loadAllData(){
  const [lodges, topPosts, topGuests, returning, countries, species, coinEconomy, subs, cashflow, subRevenue,
         churnRisk, funnel, siteSummary, siteTopPages, siteDaily, aiActions] = await Promise.all([
    db.from('platform_lodge_overview').select('*').order('created_at', {ascending:false}),
    db.from('platform_top_lodges_by_posts').select('*').limit(10),
    db.from('platform_top_lodges_by_guests').select('*').limit(10),
    db.from('platform_returning_guests').select('*').limit(15),
    db.from('platform_guests_by_country').select('*'),
    db.from('platform_species_by_region').select('*').limit(20),
    db.from('platform_coin_circulation').select('*').maybeSingle(),
    db.from('platform_subscribers_summary').select('*'),
    db.from('platform_cashflow_projection').select('*'),
    db.from('platform_subscription_revenue').select('*'),
    db.from('platform_churn_risk').select('*').limit(10),
    db.from('platform_conversion_funnel').select('*').maybeSingle(),
    db.from('site_analytics_summary').select('*').maybeSingle(),
    db.from('site_analytics_top_pages').select('*').limit(10),
    db.from('site_analytics_daily').select('*').order('dia', {ascending:true}).limit(30),
    db.from('platform_ai_actions_log').select('*').eq('status','proposed').order('created_at', {ascending:false}),
  ]);

  state.data = {
    lodges: lodges.data || [],
    topPosts: topPosts.data || [],
    topGuests: topGuests.data || [],
    returning: returning.data || [],
    countries: countries.data || [],
    species: species.data || [],
    coinEconomy: coinEconomy.data || {total_emitido:0,total_resgatado:0,total_expirado:0,em_circulacao:0},
    subs: subs.data || [],
    cashflow: cashflow.data || [],
    subRevenue: subRevenue.data || [],
    churnRisk: churnRisk.data || [],
    funnel: funnel.data || {total_solicitacoes:0,total_aprovadas:0,pousadas_com_reserva:0,pousadas_pagantes:0},
    siteSummary: siteSummary.data || {total_pageviews:0,total_sessoes:0,total_cliques_whatsapp:0,duracao_media_segundos:0},
    siteTopPages: siteTopPages.data || [],
    siteDaily: siteDaily.data || [],
    aiActions: aiActions.data || [],
  };
  const [audit, lodgeNames] = await Promise.all([
    db.from('audit_log').select('*').order('created_at', { ascending:false }).limit(150),

  `;
}

function bindAssistant(){
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  const send = async ()=>{
    const text = input.value.trim();
    if(!text || state.chatLoading) return;
    input.value = '';
    state.chatMessages.push({ role:'user', text });
    state.chatLoading = true;
    renderScreen();
    document.getElementById('chat-messages').scrollTop = 999999;

    try{
      const res = await fetch(AI_ASSISTANT_URL, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + state.session.access_token },
        body: JSON.stringify({
          user_id: state.session.user.id,
          messages: state.chatMessages.map(m=>({ role: m.role==='user'?'user':'assistant', content: m.text })),
        }),
      });
      const json = await res.json();
      state.chatMessages.push({ role:'assistant', text: json.reply || json.error || 'Sem resposta.' });
    }catch(err){
      state.chatMessages.push({ role:'assistant', text: 'Erro ao falar com a assistente: ' + err.message });
    }
    state.chatLoading = false;
    renderScreen();
    document.getElementById('chat-messages').scrollTop = 999999;
  };
  btn.onclick = send;
  input.onkeydown = (e)=>{ if(e.key==='Enter') send(); };
}

async function confirmAiAction(id){
  const { data, error } = await db.rpc('confirm_ai_action', { p_action_id: id });

  await loadAllData();
  renderScreen();
}

async function rejectAiAction(id){
  const { error } = await db.rpc('reject_ai_action', { p_action_id: id });

  await loadAllData();

}

const AUDIT_TABLE_LABELS = { benefits:'Benefício', reservations:'Reserva', lodges:'Pousada', lodge_reward_settings:'Recompensas',
  sightings:'Avistamento', redemptions:'Voucher', profiles:'Papel de usuário', lodge_invites:'Convite de equipe',

function viewAudit(){
  const rows = state.data.audit || [];
  const filter = (state.auditFilter || '').toLowerCase();
  const shown = rows.filter(a => !filter || JSON.stringify(a).toLowerCase().includes(filter));
  const diff = a => {
    const o = a.old_data || {}, n = a.new_data || {};
    if(a.action === 'INSERT') return 'criado';
    if(a.action === 'DELETE') return 'removido';
    const keys = Object.keys(n).filter(k => JSON.stringify(n[k]) !== JSON.stringify(o[k]) && !['updated_at','created_at'].includes(k));
    return keys.slice(0,4).map(k => `${k}: ${o[k] ?? '—'} → ${n[k] ?? '—'}`).join(' · ') || 'alterado';
  };
  return `
    <div class="main-header">
      <div><h1>Auditoria</h1><p>Toda alteração administrativa em todas as pousadas — quem fez, o quê e quando. Não pode ser editado.</p></div>

        datasets: [{ data:[c.total_emitido, c.total_resgatado, c.total_expirado, c.em_circulacao], backgroundColor:['#1fdf9a','#5aa9e6','#f5b942','#eef2f0'], borderRadius:6 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{grid:{color:'#1f2624'}} } }
    });
  }

  const siteDailyCanvas = document.getElementById('chart-site-daily');
  if(siteDailyCanvas){
    const d = state.data.siteDaily;
    state.charts.siteDaily = new Chart(siteDailyCanvas, {
      type: 'line',
      data: {
        labels: d.map(r=>new Date(r.dia).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})),
        datasets: [
          { label:'Visualizações', data: d.map(r=>r.pageviews), borderColor:'#1fdf9a', backgroundColor:'rgba(31,223,154,0.1)', tension:0.3, fill:true },
          { label:'Cliques WhatsApp', data: d.map(r=>r.cliques_whatsapp), borderColor:'#f5b942', backgroundColor:'rgba(245,185,66,0.1)', tension:0.3, fill:true },
        ]
      },
      options: { plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10.5}}}}, scales:{ x:{grid:{display:false}}, y:{grid:{color:'#1f2624'}} } }
    });
  }
}

  const { data } = await db.auth.getSession();
  if(data.session){
    await completeLogin(data.session);
  } else {
    renderLogin();
  }
})();
</script>
