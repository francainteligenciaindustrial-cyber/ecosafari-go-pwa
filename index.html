<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EcoSafari Go">
<title>EcoSafari Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e0c;
    --card: #141918;
    --card-border: #1f2624;
    --green: #1fdf9a;
    --green-dim: rgba(31,223,154,0.12);
    --blue: #5aa9e6;
    --text: #eef2f0;
    --text-dim: #8b9994;
    --danger: #ff6b6b;
    --amber: #f5b942;
    --radius: 14px;
    --input-bg: #0f1412;
    --warn-bg: #3a2a12;
  }
  [data-theme="light"]{
    --bg: #f5f7f6;
    --card: #ffffff;
    --card-border: #e2e6e4;
    --green: #14a874;
    --green-dim: rgba(20,168,116,0.10);
    --blue: #2f7fc7;
    --text: #16201c;
    --text-dim: #6b7873;
    --danger: #e0483f;
    --amber: #b8760a;
    --input-bg: #eef1ef;
    --warn-bg: #fdf1de;
  }
  [data-theme="light"] .phone{ box-shadow:0 30px 60px rgba(0,0,0,0.15), 0 0 0 2px #ddd; }
  [data-theme="light"] .notch{ background:#000; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  svg{width:17px; height:17px; flex-shrink:0; vertical-align:middle; display:inline-block;}
  img{max-width:100%; max-height:100%;}
  html,body{margin:0;padding:0;background:#e9e9e9;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;}
  .stage{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 0;}
  .phone{width:375px; height:780px; background:#000; border-radius:44px; padding:14px; box-shadow:0 30px 60px rgba(0,0,0,0.35), 0 0 0 2px #1a1a1a; position:relative;}
  .screen{width:100%; height:100%; background:var(--bg); border-radius:32px; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .notch{position:absolute; top:14px; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#000; border-radius:16px; z-index:20;}
  .statusbar{display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px 24px; font-size:13px; font-weight:600; color:var(--text);}
  .statusbar .right{display:flex; gap:5px; align-items:center; font-size:12px;}

  /* ===== MODO APP (tela cheia) — substitui a moldura de celular do protótipo ===== */
  html,body{background:var(--bg); height:100%; overscroll-behavior:none;}
  .stage{display:block; min-height:0; height:100vh; height:100dvh; padding:0;}
  .phone{width:100%; max-width:560px; height:100dvh; margin:0 auto; padding:0; border-radius:0; background:var(--bg); box-shadow:none;}
  .phone{height:100vh; height:100dvh;}
  [data-theme="light"] .phone{box-shadow:none;}
  .screen{border-radius:0;}
  .notch, .statusbar{display:none !important;}
  .screen > .topbar{padding-top:calc(env(safe-area-inset-top, 0px) + 12px);}
  .login-wrap{padding-top:calc(env(safe-area-inset-top, 0px) + 20px) !important;}
  .screen .content{padding-bottom:calc(90px + env(safe-area-inset-bottom, 0px));}
  #sightings-map svg{width:auto; height:auto; max-width:none; max-height:none; vertical-align:baseline; display:block;}
  #sightings-map img{max-width:none; max-height:none;}
  #sightings-map .leaflet-popup-content{color:#16201c; font-size:12.5px;}
  @media (min-width:600px){ .phone{border-left:1px solid var(--card-border); border-right:1px solid var(--card-border);} }
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 14px 18px;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--green); font-size:16px; font-family:"Fraunces", serif;}
  .brand .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--green); display:flex;align-items:center;justify-content:center;font-size:11px;}
  .topbar .right-icons{display:flex; align-items:center; gap:10px;}
  .coin-pill{display:flex; align-items:center; gap:5px; background:var(--green-dim); border:1px solid rgba(31,223,154,0.35); color:var(--green); font-weight:700; font-size:12.5px; padding:5px 10px; border-radius:20px; cursor:pointer;}
  .bell{position:relative; color:var(--text-dim); cursor:pointer;}
  .bell .badge{position:absolute; top:-3px; right:-3px; width:8px;height:8px;border-radius:50%;background:var(--green);}
  .net-dot{width:9px;height:9px;border-radius:50%; background:var(--green); box-shadow:0 0 0 2px rgba(31,223,154,0.2);}
  .net-dot.off{background:var(--danger); box-shadow:0 0 0 2px rgba(255,107,107,0.2);}

  .content{flex:1; overflow-y:auto; padding:0 16px 90px 16px;}
  .content::-webkit-scrollbar{display:none;}

  .section-title{text-transform:uppercase; letter-spacing:0.06em; font-size:12px; font-weight:700; color:var(--text-dim); margin:14px 0 4px 0; display:flex; justify-content:space-between; align-items:center;}
  .section-sub{color:var(--blue); font-size:12.5px; line-height:1.5; margin:4px 0 14px 0;}
  .add-btn{width:30px;height:30px;border-radius:50%; background:var(--green); color:#04140d; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; border:none; cursor:pointer;}

  .banner-offline{background:var(--warn-bg);color:var(--amber);font-size:11.5px;padding:9px 12px;border-radius:10px;margin:10px 0 4px 0;display:flex;align-items:center;gap:7px;font-weight:600;}
  .banner-offline svg{stroke:var(--amber);}

  .card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); margin-bottom:14px; overflow:hidden;}
  .alert-card{border-left:3px solid var(--green); padding:12px 14px;}
  .alert-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
  .alert-title{color:var(--green); font-weight:700; font-size:13px; display:flex; gap:6px; align-items:center;}
  .alert-time{color:var(--text-dim); font-size:11px;}
  .alert-body{color:var(--blue); font-size:13px; line-height:1.5;}

  .post-head{padding:12px 14px 8px 14px; display:flex; align-items:center; gap:10px;}
  .avatar{width:34px;height:34px;border-radius:50%; background:var(--card-border); display:flex;align-items:center;justify-content:center; color:var(--text-dim); font-size:13px; font-weight:700; flex-shrink:0;}
  .avatar.verified{ box-shadow:0 0 0 2px var(--green); color:var(--green); }
  .verified-tag{ color:var(--amber); display:inline-flex; vertical-align:middle; }
  .verified-tag svg{ width:13px; height:13px; }
  .post-user{font-weight:700; font-size:13.5px; color:var(--text); display:flex; align-items:center; gap:6px;}
  .post-loc{font-size:11.5px; color:var(--text-dim);}
  .post-date{margin-left:auto; font-size:11px; color:var(--text-dim); text-align:right;}
  .status-pending{color:var(--amber); font-size:9.5px; font-weight:700; background:rgba(245,185,66,0.14); padding:2px 7px; border-radius:6px;}
  .status-queued{color:var(--text-dim); font-size:9.5px; font-weight:700; background:rgba(139,153,148,0.14); padding:2px 7px; border-radius:6px;}

  .post-photo-wrap{position:relative; width:100%; height:210px; overflow:hidden; background:var(--card); isolation:isolate;}
  .post-photo-bg{position:absolute; top:-10px; left:-10px; right:-10px; bottom:-10px; width:calc(100% + 20px); height:calc(100% + 20px); max-width:none; max-height:none; background-size:cover; background-position:center; filter:blur(20px) brightness(0.5); transform:scale(1.1);}
  .post-photo{position:relative; width:100%; height:100%; max-width:100%; max-height:100%; object-fit:contain; display:block; z-index:1;}
  .post-body{padding:10px 14px 14px 14px;}
  .species{color:var(--green); font-weight:700; font-size:13.5px; margin-bottom:3px;}
  .desc{color:var(--blue); font-size:12.5px; line-height:1.5; margin-bottom:10px;}
  .action-row{display:flex; align-items:center; gap:14px; border-top:1px solid var(--card-border); padding-top:10px; flex-wrap:wrap;}
  .action-btn{display:flex; align-items:center; gap:5px; color:var(--text-dim); font-size:12px; background:none; border:none; cursor:pointer; padding:0;}
  .action-btn svg{width:16px; height:16px;}
  .action-btn.liked{color:var(--danger);}
  .action-btn.liked svg{stroke:var(--danger); fill:var(--danger);}
  .action-btn.shared{color:var(--green);}
  .action-btn.commented{color:var(--blue);}
  .report-link{margin-left:auto; font-size:10.5px; color:var(--text-dim); cursor:pointer; background:none; border:none; text-decoration:underline;}
  .comment-panel{margin-top:10px; padding-top:10px; border-top:1px solid var(--card-border);}
  .comment-viewall{font-size:11.5px; color:var(--text-dim); margin-bottom:8px; cursor:pointer;}
  .comment-item{font-size:12px; color:var(--text); margin-bottom:8px; line-height:1.4; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .comment-item b{color:var(--green); font-weight:700; margin-right:4px;}
  .comment-like-btn{background:none; border:none; color:var(--text-dim); font-size:10.5px; display:flex; align-items:center; gap:3px; cursor:pointer; flex-shrink:0; padding:1px 0;}
  .comment-like-btn svg{width:12px; height:12px;}
  .comment-like-btn.liked{color:var(--danger);}
  .comment-like-btn.liked svg{stroke:var(--danger); fill:var(--danger);}
  .comment-input-row{display:flex; gap:8px; margin-top:6px;}
  .comment-input-row input{flex:1; background:var(--input-bg); border:1px solid var(--card-border); border-radius:20px; padding:8px 13px; color:var(--text); font-size:12px; outline:none;}
  .comment-input-row button{background:var(--green); color:#04140d; border:none; border-radius:16px; padding:0 14px; font-size:12px; font-weight:700; cursor:pointer;}

  .checkin-card{padding:16px;}
  .badge-pill{display:inline-block; background:var(--card-border); color:var(--text-dim); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:5px; letter-spacing:0.03em; margin-bottom:8px;}
  .checkin-title{font-size:16px; font-weight:700; color:var(--text); margin-bottom:3px;}
  .checkin-period{font-size:12.5px; color:var(--text-dim); margin-bottom:16px;}
  .btn-primary{width:100%; background:var(--green); color:#04140d; border:none; border-radius:10px; padding:13px; font-weight:700; font-size:14px; cursor:pointer;}
  .btn-primary:disabled{opacity:0.6; cursor:default;}
  .btn-ghost{width:100%; background:transparent; color:var(--green); border:1px solid var(--green); border-radius:10px; padding:11px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:8px;}
  .geo-status{font-size:12px; color:var(--text-dim); margin-top:10px; text-align:center; min-height:16px;}

  .navbar{position:absolute; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--card-border); display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom, 0px)) 0; border-radius:0; z-index:5;}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:var(--text-dim); font-size:9.5px;}
  .nav-item.active{color:var(--green);}
  .nav-item svg{width:20px;height:20px;}

  .login-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px 28px; overflow-y:auto; min-height:0;}
  .login-logo{display:flex; flex-direction:column; align-items:center; margin-bottom:34px;}
  .login-logo .circle{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--green); display:flex;align-items:center;justify-content:center; font-size:26px; margin-bottom:12px;}
  .login-logo h1{color:var(--text); font-size:20px; margin:0; font-family:"Fraunces", serif; font-weight:700;}
  .login-logo p{color:var(--text-dim); font-size:12px; margin:4px 0 0 0;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
  .field input{width:100%; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:12px 13px; color:var(--text); font-size:13.5px; outline:none;}
  .field input:focus{border-color:var(--green);}
  .login-hint{text-align:center; color:var(--text-dim); font-size:11px; margin-top:18px;}

  .modal-overlay{position:absolute; inset:0; background:rgba(0,0,0,0.55); z-index:30; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s;}
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal{width:100%; max-height:92%; overflow-y:auto; background:var(--card); border-top:1px solid var(--card-border); border-radius:22px 22px 0 0; padding:20px 20px calc(26px + env(safe-area-inset-bottom, 0px)) 20px; transform:translateY(20px); transition:transform .2s;}
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal h3{margin:0 0 14px 0; color:var(--text); font-size:15px;}
  .modal .field input{width:100%; background:var(--input-bg); border:1px solid var(--card-border); border-radius:10px; padding:11px 12px; color:var(--text); font-size:13px; outline:none;}
  .photo-drop{border:1.5px dashed var(--card-border); border-radius:12px; padding:22px; text-align:center; color:var(--text-dim); font-size:12px; margin-bottom:14px; cursor:pointer; display:block;}
  .photo-drop img{max-height:110px; border-radius:8px;}
  .photo-warning{background:rgba(245,185,66,0.12); color:var(--amber); font-size:11.5px; padding:9px 11px; border-radius:8px; margin-bottom:12px; line-height:1.4;}
  .loc-attached-chip{background:var(--green-dim); color:var(--green); font-size:12px; font-weight:600; padding:9px 12px; border-radius:8px; display:flex; align-items:center; gap:6px;}
  .loc-attached-chip svg{width:14px;height:14px;}
  .no-photo-tag{background:rgba(139,153,148,0.14); color:var(--text-dim); font-size:10px; font-weight:700; padding:2px 8px; border-radius:6px;}

  .toast{position:absolute; top:calc(env(safe-area-inset-top, 0px) + 60px); left:50%; transform:translateX(-50%) translateY(-14px); background:var(--card); color:var(--text); font-weight:600; font-size:12.5px; line-height:1.45; padding:12px 16px; border-radius:14px; opacity:0; transition:all .25s; z-index:40; width:84%; max-width:300px; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,0.28); border:1px solid var(--card-border); border-left:3px solid var(--green); pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @keyframes fadeInUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  @keyframes coinPop{0%{transform:scale(1);} 35%{transform:scale(1.35); color:var(--amber);} 100%{transform:scale(1);}}
  .coin-pill.pop{animation:coinPop .5s ease;}
  .toast.reward{border-left-color:var(--amber); box-shadow:0 10px 26px rgba(245,185,66,0.25);}
  .feed-badge{display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:800; vertical-align:middle;}

  .wallet-hero{background:linear-gradient(135deg, rgba(31,223,154,0.15), rgba(31,223,154,0.03)); border:1px solid rgba(31,223,154,0.3); border-radius:16px; padding:20px; text-align:center; margin:8px 0 18px 0;}
  .wallet-hero .amt{font-size:34px; font-weight:800; color:var(--green);}
  .wallet-hero .lbl{font-size:11.5px; color:var(--text-dim); letter-spacing:0.05em; text-transform:uppercase; margin-top:2px;}
  .benefit{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .benefit-name{color:var(--text); font-size:13px; font-weight:600;}
  .benefit-cost{color:var(--text-dim); font-size:11.5px;}
  .redeem-btn{background:var(--green-dim); color:var(--green); border:1px solid rgba(31,223,154,0.4); border-radius:8px; padding:7px 12px; font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .redeem-btn:disabled{opacity:0.35; cursor:default;}
  .back-link{color:var(--text-dim); font-size:12.5px; margin-bottom:6px; cursor:pointer; display:inline-block;}
  .voucher-code{font-family:"SF Mono",Menlo,monospace; font-size:22px; letter-spacing:3px; color:var(--green); text-align:center; background:var(--input-bg); border:1px dashed rgba(31,223,154,0.4); border-radius:10px; padding:16px; margin:14px 0;}

  .badge-grid{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px;}
  .badge-chip{background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:10px 6px; text-align:center; width:80px;}
  .badge-chip .ic{font-size:21px;}
  .badge-chip .nm{font-size:9px; color:var(--text-dim); margin-top:4px; line-height:1.25;}
  .badge-chip.locked{opacity:0.35;}

  .rank-row{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
  .rank-row.me{border-color:rgba(31,223,154,0.5); background:var(--green-dim);}
  .rank-pos{width:18px; font-weight:800; color:var(--text-dim); font-size:12px;}
  .rank-name{flex:1; font-size:12.5px; color:var(--text); font-weight:600;}
  .rank-pts{font-size:12px; color:var(--green); font-weight:700;}

  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--card-border);font-size:12.5px;color:var(--text);cursor:pointer;}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .chev{color:var(--text-dim);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 2px; font-size:12.5px; color:var(--text);}
  .switch{width:38px; height:22px; border-radius:12px; background:var(--card-border); position:relative; cursor:pointer; flex-shrink:0;}
  .switch.on{background:var(--green);}
  .switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s;}
  .switch.on .knob{transform:translateX(16px);}
  .disclaimer-box{font-size:10.5px; color:var(--text-dim); line-height:1.5; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:12px; margin-top:16px;}
  .danger-btn{width:100%; background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:10px; padding:11px; font-weight:700; font-size:12.5px; cursor:pointer; margin-top:16px;}

  .guide-item{background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .guide-actions{display:flex; gap:8px; margin-top:10px;}
  .btn-approve{flex:1; background:var(--green); color:#04140d; border:none; border-radius:8px; padding:9px; font-weight:700; font-size:12px; cursor:pointer;}
  .btn-reject{flex:1; background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:8px; padding:9px; font-weight:700; font-size:12px; cursor:pointer;}

  .policy-text{font-size:12px; color:var(--text-dim); line-height:1.6;}
  .policy-text h4{color:var(--text); font-size:13px; margin:14px 0 4px 0;}
  /* ===== PERFIL SOCIAL (estilo Instagram + capa) ===== */
  .pf{margin:0 -16px;}
  .pf-cover{position:relative; height:158px; background:linear-gradient(135deg,#0c3a2b 0%,#14a874 55%,#7fe7c4 120%); overflow:hidden;}
  .pf-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .pf-cover-btn{position:absolute; top:12px; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
  .pf-cover-btn.l{left:12px;} .pf-cover-btn.r{right:12px;} .pf-cover-btn.r2{right:56px;}
  .pf-head{display:flex; align-items:flex-end; gap:14px; padding:0 16px; margin-top:-42px; position:relative;}
  .pf-avatar{width:92px; height:92px; border-radius:50%; border:4px solid var(--bg); background:var(--card-border); flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:var(--text-dim);}
  .pf-avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
  .pf-avatar.verified{box-shadow:0 0 0 2px var(--green);}
  .pf-avatar .pf-edit{position:absolute; right:-2px; bottom:2px; width:26px; height:26px; border-radius:50%; background:var(--green); color:#04130d; border:3px solid var(--bg); display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer;}

function t(key, vars){
  let str = (LANG[state.lang] && LANG[state.lang][key]) || LANG.pt[key] || key;
  if(vars) Object.keys(vars).forEach(k => { str = str.replace('{'+k+'}', vars[k]); });
  return str;
}

/* Moeda com nome/ícone configuráveis por pousada (ex: "JaguarCoin" 🪙
   pode virar "SafariCoin" 🦁 em outra pousada, sem mudar código) */
function currencyName(){
  return (state.lodgeFeatures && state.lodgeFeatures.currency_name) || 'JaguarCoin';
}
function currencyIcon(){
  return (state.lodgeFeatures && state.lodgeFeatures.currency_icon) || '🪙';
}
function currencyLabel(amount){
  return `${currencyIcon()} ${amount} ${currencyName()}`;
}

/* "Há quanto tempo" com base no momento REAL do avistamento
   (observed_at), não em quando foi enviado pro banco. */
function timeAgo(dateStr){
  if(!dateStr) return '';
  const diffSec = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if(diffSec < 60) return 'agora mesmo';
  if(diffSec < 3600) return `há ${Math.floor(diffSec/60)} min`;
  if(diffSec < 86400) return `há ${Math.floor(diffSec/3600)}h`;
  return `há ${Math.floor(diffSec/86400)}d`;
}

function formatGap(ms){
  const mins = Math.floor(ms / 60000);
  if(mins < 60) return `${mins} min`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `${hours}h`;
  return `${Math.floor(hours/24)}d`;
}

async function loadSpeciesCatalog(){
  if(!state.profile) return;
  const { data, error } = await db
    .from('species')
    .select('*')
    .or(`lodge_id.is.null,lodge_id.eq.${state.profile.lodge_id}`)
    .order('common_name');
  if(error){ console.error('species', error.message); return; }
  state.speciesCatalog = data || [];
}

async function loadFollowedSpecies(){
  const { data, error } = await db
    .from('user_followed_species')
    .select('species_id')
    .eq('user_id', state.session.user.id);
  if(error){ console.error('followed species', error.message); return; }
  state.followedSpecies = (data || []).map(r => r.species_id);
}

const FEED_PAGE_SIZE = 20;

async function loadSightings(loadMore = false){
  if(!state.profile) return;
  const page = loadMore ? state.feedPage + 1 : 0;
  const from = page * FEED_PAGE_SIZE;
  const to = from + FEED_PAGE_SIZE - 1;

  let query = db.from('sightings').select('*');
  if(state.feedScope === 'global' || !state.profile.lodge_id){
    query = query.eq('status', 'approved');
  } else {
    query = query.eq('lodge_id', state.profile.lodge_id)
      .or(`status.eq.approved,user_id.eq.${state.session.user.id}`);
  }
  const { data, error } = await query
    .order('created_at', { ascending:false })
    .range(from, to);
  if(error){ console.error('sightings', error.message); return; }
  const rows = data || [];
  state.feedPage = page;
  state.feedHasMore = rows.length === FEED_PAGE_SIZE;

  const userIds = [...new Set(rows.map(r=>r.user_id))];
  let profilesById = {};
  if(userIds.length){
    const { data: profs } = await db.rpc('get_profiles_basic', { p_ids: userIds });
    (profs||[]).forEach(p => { profilesById[p.id] = p; });
  }

  const lodgeIds = [...new Set(rows.map(r=>r.lodge_id))];
  let lodgeNamesById = {};
  if(lodgeIds.length){
    const { data: lodgesData } = await db.from('lodges').select('id, name').in('id', lodgeIds);
    (lodgesData||[]).forEach(l => { lodgeNamesById[l.id] = l.name; });
  }

  const sightingIds = rows.map(r=>r.id);
  let likedSet = new Set();
  if(sightingIds.length){
    const { data: myLikes } = await db.from('sighting_likes').select('sighting_id').eq('user_id', state.session.user.id).in('sighting_id', sightingIds);
    (myLikes||[]).forEach(l => likedSet.add(l.sighting_id));
  }

  let commentsBySighting = {};
  if(sightingIds.length){
    const { data: comments } = await db
      .from('sighting_comments')
      .select('*')
      .in('sighting_id', sightingIds)
      .order('created_at', { ascending:true });
    const commentUserIds = [...new Set((comments||[]).map(c=>c.user_id))];
    let commentProfiles = {};
    if(commentUserIds.length){
      const { data: cp } = await db.rpc('get_profiles_basic', { p_ids: commentUserIds });
      (cp||[]).forEach(p => { commentProfiles[p.id] = p.full_name; });
    }
    (comments||[]).forEach(c=>{
      if(!commentsBySighting[c.sighting_id]) commentsBySighting[c.sighting_id] = [];
      commentsBySighting[c.sighting_id].push({
        id: c.id, user: esc(commentProfiles[c.user_id] || 'Hóspede'), text: esc(c.body),
        likes: c.likes_count || 0, likedByMe:false,
      });
    });
  }

  const mapped = rows.map(r => ({
    id: r.id,
    userId: r.user_id,
    user: esc(profilesById[r.user_id] ? profilesById[r.user_id].full_name : 'Hóspede'),
    verified: profilesById[r.user_id] ? !!profilesById[r.user_id].verified_observer : false,
    avatarUrl: profilesById[r.user_id] ? profilesById[r.user_id].avatar_url : null,
    loc: esc(lodgeNamesById[r.lodge_id] || 'Pousada'),
    date: new Date(r.created_at).toLocaleDateString('pt-BR') + ' às ' + new Date(r.created_at).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}),
    species: esc(r.species_text),
    speciesId: r.species_id,
    desc: esc(r.description || ''),
    photo: r.photo_url,
    thumb: r.photo_thumb_url || r.photo_url,
    videoUrl: r.video_url, videoTrimStart: r.video_trim_start || 0, observedAt: r.observed_at || r.created_at, createdAt: r.created_at,
    hasPhoto: !!r.has_photo,
    coords: r.location_lat != null ? { lat:r.location_lat, lng:r.location_lng } : null,
    likes: r.likes_count || 0,
    liked: likedSet.has(r.id),
    status: r.status,
    byUser: r.user_id === state.session.user.id,
    commentsOpen: false,
    showAllComments: false,
    comments: commentsBySighting[r.id] || [],
  }));

  state.sightings = loadMore ? [...state.sightings, ...mapped] : mapped;
}

async function setFeedScope(scope){
  if(state.feedScope === scope) return;
  state.feedScope = scope;
  state.feedPage = 0;
  state.sightings = [];
  if(scope === 'lodge') state.newPostsLodge = 0;
  if(scope === 'global') state.newPostsGlobal = 0;
  render();
  await loadSightings(false);
  document.getElementById('content').innerHTML = avistamentosView();
}

function subscribeToNewSightings(){
  if(!state.profile) return;
  if(window.__sightingsChannel){
    db.removeChannel(window.__sightingsChannel);
  }
  window.__sightingsChannel = db.channel('sightings-approved-watch')
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'sightings' },
      (payload) => {
        const wasApproved = payload.old.status === 'approved';
        const nowApproved = payload.new.status === 'approved';
        if(nowApproved && !wasApproved){
          // conta para "Global" sempre (é de qualquer pousada);
          // conta para "Minha Pousada" só se for da mesma pousada do usuário
          if(payload.new.lodge_id === state.profile.lodge_id){
            if(state.feedScope !== 'lodge'){
              state.newPostsLodge++;
              renderTopBarBadgesOnly();
            }
          }
          if(state.feedScope !== 'global'){
            state.newPostsGlobal++;
            renderTopBarBadgesOnly();
          }
        }
      }
    )
    .subscribe();
}

async function loadAll(){
  state.loading = true;
  const tasks = {
    speciesCatalog: loadSpeciesCatalog(),
    followedSpecies: loadFollowedSpecies(),
    sightings: loadSightings(),
    wallet: loadWallet(),
    alerts: loadAlerts(),
    ranking: loadRanking(),
    badges: loadBadges(),
    reservation: loadReservation(),
    rewardSettings: loadRewardSettings(),
  };
  const results = await Promise.allSettled(Object.values(tasks));
  const names = Object.keys(tasks);
  results.forEach((r, i)=>{
    if(r.status === 'rejected'){
      console.error(`Falha ao carregar "${names[i]}":`, r.reason);
    }
  });
  state.loading = false;
  render();
}

function passwordStrength(pw){
  return {
    length: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    number: /[0-9]/.test(pw),
  };
}
function isPasswordStrong(pw){
  const s = passwordStrength(pw);
  return s.length && s.upper && s.lower && s.number;
}

function attachLogin(){
  if(state.lodgeSignupOpen){
    const btn = document.getElementById('ls-btn');
    btn.onclick = async ()=>{
      const name = document.getElementById('ls-name').value.trim();
      const address = document.getElementById('ls-address').value.trim();
      const taxId = document.getElementById('ls-taxid').value.trim();
      const applicantName = document.getElementById('ls-applicant-name').value.trim();
      const applicantEmail = document.getElementById('ls-applicant-email').value.trim();
      const applicantPhone = document.getElementById('ls-applicant-phone').value.trim();
      const msg = document.getElementById('ls-msg');

      if(!name || !address || !taxId || !applicantName || !applicantEmail){
        msg.style.color = 'var(--danger)'; msg.textContent = 'Preencha todos os campos obrigatórios.';
        return;
      }

      btn.disabled = true; btn.textContent = 'Enviando...';
      const { error } = await db.rpc('submit_lodge_application', {
        p_lodge_name: name, p_address: address, p_tax_id: taxId,
        p_applicant_name: applicantName, p_applicant_email: applicantEmail, p_applicant_phone: applicantPhone || null,
      });
      btn.disabled = false; btn.textContent = 'Enviar cadastro';

      if(error){ msg.style.color = 'var(--danger)'; msg.textContent = error.message; return; }

      state.lodgeSignupOpen = false;
      render();
      showToast('Cadastro enviado! Nossa equipe vai analisar e entrar em contato por e-mail.');
    };
    return;
  }

  if(state.forgotPasswordOpen){
    const sendBtn = document.getElementById('fp-send-btn');
    sendBtn.onclick = async ()=>{
      const email = document.getElementById('fp-email').value.trim();
      const msg = document.getElementById('fp-msg');
      if(!email){ msg.style.color = 'var(--danger)'; msg.textContent = t('login_error_fill'); return; }
      sendBtn.disabled = true;
      sendBtn.textContent = t('forgot_sending');
      const { error } = await db.auth.resetPasswordForEmail(email);
      sendBtn.disabled = false;
      sendBtn.textContent = t('forgot_send');
      if(error){ msg.style.color = 'var(--danger)'; msg.textContent = t('forgot_error'); return; }
      msg.style.color = 'var(--green)';
      msg.textContent = t('forgot_sent');
    };
    return;
  }

  if(state.signupOpen){
    const strengthBox = document.getElementById('su-strength');
    const passInput = document.getElementById('su-pass');
    passInput.oninput = ()=>{
      const s = passwordStrength(passInput.value);
      const check = (ok)=> ok ? '✅' : '⬜';
      strengthBox.innerHTML =
        `${check(s.length)} 8+ caracteres &nbsp; ${check(s.upper)} maiúscula &nbsp; ${check(s.lower)} minúscula &nbsp; ${check(s.number)} número`;
    };

    const suBtn = document.getElementById('su-btn');
    suBtn.onclick = async ()=>{
      const name = document.getElementById('su-name').value.trim();
      const birthDate = document.getElementById('su-birthdate').value;
      const nationality = document.getElementById('su-nationality').value.trim();
      const email = document.getElementById('su-email').value.trim();
      const email2 = document.getElementById('su-email2').value.trim();
      const pass = document.getElementById('su-pass').value;
      const pass2 = document.getElementById('su-pass2').value;
      const errBox = document.getElementById('su-error');
      errBox.textContent = '';

      if(!name || !email || !email2 || !pass || !pass2){
        errBox.textContent = t('signup_fill_all');
        return;
      }
      if(email.toLowerCase() !== email2.toLowerCase()){
        errBox.textContent = t('signup_email_mismatch');
        return;
      }
      if(pass !== pass2){
        errBox.textContent = t('signup_password_mismatch');
        return;
      }
      if(!isPasswordStrong(pass)){
        errBox.textContent = t('signup_weak_password');
        return;
      }

      suBtn.disabled = true;
      suBtn.textContent = t('signup_creating');
      const { data, error } = await db.auth.signUp({
        email, password: pass, options: { data: { full_name: name } }
      });
      suBtn.disabled = false;
      suBtn.textContent = t('signup_button');

      if(error){
        errBox.textContent = error.message;
        return;
      }

      // Salva idade/nacionalidade no perfil assim que ele existir
      // (o gatilho handle_new_user cria a linha; damos um pequeno tempo)
      if(data.user && (birthDate || nationality)){
        setTimeout(async ()=>{
          await db.from('profiles').update({
            birth_date: birthDate || null,
            nationality: nationality || null,
          }).eq('id', data.user.id);
        }, 800);
      }

      if(data.session){
        // projeto configurado sem confirmação de e-mail: já entra direto
        await completeLogin(data.session, data.user);
      } else {
        state.signupOpen = false;
        render();
        showToast(t('signup_success'));
      }
    };
    return;
  }

  const btn = document.getElementById('li-btn');
  btn.onclick = async ()=>{
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-pass').value;
    const errBox = document.getElementById('li-error');
    errBox.textContent = '';

    if(!email || !password){
      errBox.textContent = t('login_error_fill');
      return;
    }

    btn.disabled = true;
    btn.textContent = t('login_entering');

    const { data, error } = await db.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = t('login_button');

    if(error){
      console.error('Supabase auth error:', error.message);
      if(/email not confirmed/i.test(error.message)){
        errBox.textContent = 'E-mail ainda não confirmado. Confirme o e-mail (ou marque "Auto Confirm User" no Supabase) antes de entrar.';
      } else if(/invalid api key|failed to fetch/i.test(error.message)){
        errBox.textContent = 'Não foi possível conectar ao Supabase. Verifique a URL/chave do projeto.';
      } else {
        errBox.textContent = t('login_error_invalid') + ' (' + error.message + ')';
      }
      return;
    }

    await completeLogin(data.session, data.user);
  };

  const googleBtn = document.getElementById('li-google-btn');
  if(googleBtn) googleBtn.onclick = async ()=>{
    await db.auth.signInWithOAuth({ provider: 'google' });
  };
}

/* =====================================================================
   PUSH NOTIFICATIONS (Capacitor + Firebase)
   Só faz algo quando o app está rodando empacotado pelo Capacitor —
   em um navegador comum, essa função não faz nada (sem gerar erro).
   ===================================================================== */
async function registerPushNotifications(){
  if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
  const PushNotifications = window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
  if(!PushNotifications) return;

  try{
    let permStatus = await PushNotifications.checkPermissions();
    if(permStatus.receive === 'prompt'){
      permStatus = await PushNotifications.requestPermissions();
    }
    if(permStatus.receive !== 'granted'){
      console.log('Permissão de notificação negada pelo usuário.');
      return;
    }

    await PushNotifications.register();

    PushNotifications.addListener('registration', async (token) => {
      if(!state.session) return;
      const { error } = await db.from('push_tokens').upsert({
        user_id: state.session.user.id,
        token: token.value,
        platform: window.Capacitor.getPlatform(),
      }, { onConflict: 'user_id,token' });
      if(error) console.error('Erro ao salvar token de push:', error.message);
    });

    PushNotifications.addListener('registrationError', (err) => {
      console.error('Erro ao registrar push notification:', err);
    });

    PushNotifications.addListener('pushNotificationReceived', (notification) => {
      showToast(notification.title || 'Nova notificação do EcoSafari Go');
      loadAlerts().then(render);
    });

    PushNotifications.addListener('pushNotificationActionPerformed', () => {
      state.screen = 'alertas';
      render();
    });
  }catch(err){
    console.error('Falha ao configurar push notifications:', err);
  }
}

/* Etapa final do login (depois do aceite dos termos e do 2FA) */
async function finishLogin(){
  try{
    const gate = await checkMfaGate();
    if(gate){ state.mfaGate = gate; render(); return; }
    state.screen = 'avistamentos';
    render();
    await loadAll();
    registerPushNotifications();
    subscribeToNewSightings();
    refreshWebPushState().then(()=>{ if(state.screen==='perfil' || state.screen==='alertas') render(); });
    await queueRefreshState();
    syncQueue();
    if(state.deepLinkUser){ const u = state.deepLinkUser; state.deepLinkUser = null; clearDeepLinkFromUrl(); openUserByUsername(u); }
  }catch(err){
    reportError(err);
    state.loading = false;
    render();
    showToast('Ocorreu um erro ao carregar seus dados. Tente novamente.');
  }
}

async function completeLogin(session, user){
  state.session = session;
  state.loggedUser = user.email;

  try{
    let { data: profile, error: profileError } = await db.from('profiles').select('*').eq('id', user.id).single();
    if(profileError){
      console.error('profile fetch error (1st try):', profileError.message);
      await new Promise(r => setTimeout(r, 600));
      const retry = await db.from('profiles').select('*').eq('id', user.id).single();
      profile = retry.data;
      profileError = retry.error;
    }
    if(profileError){ console.error('profile fetch error:', profileError.message); }
    state.profile = profile || null;

    if(profile && !profile.avatar_url){
      const googleAvatar = user.user_metadata && (user.user_metadata.avatar_url || user.user_metadata.picture);
      if(googleAvatar){
        state.profile.avatar_url = googleAvatar;
        db.from('profiles').update({ avatar_url: googleAvatar }).eq('id', user.id).then(()=>{});
      }
    }

    if(profile){
      state.theme = profile.theme_preference || 'dark';
      state.lang = profile.language_preference || 'pt';

      // Hóspede sem pousada vinculada vê o feed Global até validar um código
      if(!profile.lodge_id) state.feedScope = 'global';

      if(state.profile.lodge_id){
        const { data: features } = await db
          .from('lodge_plan_features')
          .select('*')
          .eq('lodge_id', state.profile.lodge_id)
          .maybeSingle();
        if(features){
          state.profile.lodge_name = features.display_name || features.name;
          state.lodgeFeatures = features;
        }
      }
    }

    state.screen = 'avistamentos';

    if(!state.profile){
      state.loading = false;
      render();
      showToast('Não encontramos seu perfil no banco de dados. Algumas telas podem não funcionar.');
      return;
    }

    if(state.profile.analytics_consent) enableAnalytics(user.id);
    track('login');

    await loadPlatformSettings();
    if(needsConsent()){ state.consentRequired = true; render(); return; }
    await finishLogin();
  }catch(err){
    reportError(err);
    console.error('completeLogin failed:', err);
    state.loading = false;
    state.screen = 'avistamentos';
    render();
    showToast('Ocorreu um erro ao carregar seus dados. Veja o console do navegador (F12) para detalhes.');
  }
}

function findSighting(id){ return state.sightings.find(s=>s.id===id); }

function pickPreviewComments(comments){
  const hasLikes = comments.some(c=>(c.likes||0) > 0);
  if(hasLikes){
    return [...comments].sort((a,b)=>(b.likes||0)-(a.likes||0)).slice(0,3);
  }
  return comments.slice(-3);
}

function renderCommentPanel(s){
  const total = s.comments.length;
  const list = s.showAllComments ? s.comments : pickPreviewComments(s.comments);
  const hiddenCount = total - list.length;
  return `
    <div class="comment-panel">
      ${total===0 ? `<div class="comment-item" style="color:var(--text-dim)">${t('comment_be_first')}</div>` : ''}
      ${!s.showAllComments && hiddenCount > 0 ? `<div class="comment-viewall" onclick="setShowAllComments('${s.id}', true)">${t('comment_view_all',{n:total})}</div>` : ''}
      ${list.map(c=>`
        <div class="comment-item">
          <div><b>${c.user}</b>${c.text}</div>
          <button class="comment-like-btn ${c.likedByMe?'liked':''}" onclick="toggleCommentLike('${s.id}', '${c.id}')">${icon('heart')} ${c.likes||0}</button>
        </div>
      `).join('')}
      ${s.showAllComments && total > 3 ? `<div class="comment-viewall" onclick="setShowAllComments('${s.id}', false)">${t('comment_view_less')}</div>` : ''}
      <div class="comment-input-row">
        <input type="text" placeholder="${t('comment_placeholder')}" id="cinput-${s.id}" onkeydown="if(event.key==='Enter')addComment('${s.id}')">
        <button onclick="addComment('${s.id}')">${t('comment_send')}</button>
      </div>
    </div>
  `;
}

async function toggleLike(id){
  const s = findSighting(id); if(!s) return;
  s.liked = !s.liked;
  s.likes += s.liked ? 1 : -1;
  document.getElementById('content').innerHTML = avistamentosView();
  const { error } = await db.rpc('toggle_sighting_like', { p_sighting_id: id });
  if(error) console.error('like', error.message);
}

function toggleComments(id){
  const s = findSighting(id); if(!s) return;
  s.commentsOpen = !s.commentsOpen;
  document.getElementById('content').innerHTML = avistamentosView();
}

function setShowAllComments(id, val){
  const s = findSighting(id); if(!s) return;
  s.showAllComments = val;
  document.getElementById('content').innerHTML = avistamentosView();
}

async function toggleCommentLike(sightingId, commentId){
  const s = findSighting(sightingId); if(!s) return;
  const c = s.comments.find(c=>c.id===commentId); if(!c) return;
  c.likedByMe = !c.likedByMe;
  c.likes = (c.likes||0) + (c.likedByMe ? 1 : -1);
  document.getElementById('content').innerHTML = avistamentosView();
  const { error } = await db.rpc('toggle_comment_like', { p_comment_id: commentId });
  if(error) console.error('comment like', error.message);
}

async function addComment(sightingId){
  const input = document.getElementById('cinput-'+sightingId);
  const text = input.value.trim();
  if(!text) return;
  if(!state.profile || !state.profile.verified_guest){
    showToast('Valide o código da sua reserva na aba Check-in antes de comentar.');
    return;
  }
  const { data, error } = await db
    .from('sighting_comments')
    .insert({ sighting_id: sightingId, user_id: state.session.user.id, body: text })
    .select().single();
  if(error){ console.error('comment insert', error.message); showToast('Não foi possível enviar o comentário.'); return; }
  const s = findSighting(sightingId);
  s.comments.push({ id:data.id, user: esc(state.profile.full_name || 'Você'), text: esc(text), likes:0, likedByMe:false });
  s.showAllComments = true;
  document.getElementById('content').innerHTML = avistamentosView();
}

function reportPost(id){
  db.from('reports').insert({ sighting_id:id, reporter_id: state.session.user.id }).then(({error})=>{
    if(error) console.error('report', error.message);
  });
  showToast('Denúncia enviada à equipe EcoSafari.');
}

function shareLocation(id){
  const s = findSighting(id);
  if(!s || !s.coords){
    showToast('Este avistamento não tem localização anexada pelo autor.');
    return;
  }
  const { lat, lng } = s.coords;
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

  if(navigator.share){
    navigator.share({ title: `Localização do avistamento: ${unesc(s.species)}`, url: mapsUrl }).catch(()=>{});
  } else {
    window.open(mapsUrl, '_blank');
  }

  s.locationShared = true;
  document.getElementById('content').innerHTML = avistamentosView();
}

function shareBranded(id){
  const s = findSighting(id); if(!s) return;
  showToast('Preparando imagem para compartilhar...');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    try{
      const size = 800;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      const grad = ctx.createLinearGradient(0, size*0.7, 0, size);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.75)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, size*0.65, size, size*0.35);
      ctx.fillStyle = '#1fdf9a';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('🌿 EcoSafari Go', 24, size-70);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(unesc(s.species), 24, size-34);
      canvas.toBlob((blob)=>{
        const file = new File([blob], 'ecosafari-avistamento.jpg', {type:'image/jpeg'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:'EcoSafari Go', text: s.species}).catch(()=>{});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'ecosafari-avistamento.jpg'; a.click();
          showToast('Imagem baixada com a marca EcoSafari Go!');
        }
      }, 'image/jpeg', 0.9);
    }catch(err){ showToast('Não foi possível preparar essa imagem para compartilhar.'); }
  };
  img.onerror = ()=> showToast('Não foi possível preparar essa imagem para compartilhar.');
  img.src = s.photo;
}

async function claimReservationCode(){
  const input = document.getElementById('voucher-code');
  const msg = document.getElementById('voucher-msg');
  const btn = document.getElementById('voucher-btn');
  const code = input.value.trim().toUpperCase();
  if(!code){ msg.style.color='var(--danger)'; msg.textContent = 'Digite o código da reserva.'; return; }
  btn.disabled = true; btn.textContent = 'Validando...';
  const { data, error } = await db.rpc('claim_reservation', { p_code: code });
  btn.disabled = false; btn.textContent = 'Validar código';
  if(error){
    msg.style.color = 'var(--danger)';
    msg.textContent = error.message;
    return;
  }
  msg.style.color = 'var(--green)';
  msg.textContent = `Reserva confirmada em ${data.lodge_name}!`;

  // Recarrega o perfil inteiro do banco (não só os 2 campos) para garantir
  // que lodge_id, verified_guest, etc. fiquem sincronizados de verdade.
  const { data: freshProfile } = await db.from('profiles').select('*').eq('id', state.session.user.id).single();
  if(freshProfile){
    state.profile = freshProfile;
    if(freshProfile.lodge_id){
      const { data: lodge } = await db.from('lodges').select('name').eq('id', freshProfile.lodge_id).single();
      if(lodge) state.profile.lodge_name = lodge.name;
    }
  }

  await loadReservation();
  await loadAll();
  state.skipGate = false; state.screen = 'checkin'; render();
  showToast('Código validado! Agora você já pode publicar avistamentos.');
}

function doGeofenceCheckin(){
  if(!state.reservation) return;
  if(!state.online){
    queueAdd({type:'checkin', clientId:newClientId()});
    showToast(t('offline_label'));
    render();
    return;
  }
  state.geoStatus = t('checkin_getting_location');
  document.getElementById('geo-status').textContent = state.geoStatus;
  if(!navigator.geolocation){
    state.geoStatus = t('checkin_gps_unavailable');
    document.getElementById('geo-status').textContent = state.geoStatus;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{ completeCheckin(pos.coords.latitude, pos.coords.longitude); },
    ()=>{
      state.geoStatus = t('checkin_location_failed');
      document.getElementById('geo-status').textContent = state.geoStatus;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

async function completeCheckin(lat, lng){
  const { data, error } = await db.rpc('checkin_reservation', {
    p_reservation_id: state.reservation.id, p_lat: lat, p_lng: lng
  });
  if(error){
    console.error('checkin', error.message);
    state.geoStatus = t('checkin_location_failed');
    render();
    return;
  }
  if(data === false){
    state.geoStatus = 'Você parece estar longe demais da pousada para confirmar o check-in.';
    render();
    return;
  }
  state.checkinDone = true;
  await loadWallet();
  render();
  showToast(`Check-in confirmado! +${currencyLabel(state.rewardSettings.checkin)}`, 'reward');
  pulseCoinPill();
}

/* Links de pagamento do Stripe (Payment Links) — crie em
   dashboard.stripe.com > Payment Links (não precisa de nenhum código de
   servidor). Cole a URL gerada em cada linha abaixo. Enquanto estiver
   com "SEU-LINK-AQUI", o botão avisa que ainda não foi configurado. */
const STRIPE_PAYMENT_LINKS = {
  pro: 'https://buy.stripe.com/SEU-LINK-PRO-AQUI',
  premium: 'https://buy.stripe.com/SEU-LINK-PREMIUM-AQUI',
};

function goToUpgradeCheckout(planCode){
  const link = STRIPE_PAYMENT_LINKS[planCode];
  if(!link || link.includes('SEU-LINK')){
    showToast('Pagamento ainda não configurado pela equipe EcoSafari Go. Avise o suporte.');
    return;
  }
  // Anexa o e-mail e o id da pousada como referência, para conseguirmos
  // saber automaticamente quem pagou quando o webhook do Stripe processar.
  const url = new URL(link);
  if(state.loggedUser) url.searchParams.set('prefilled_email', state.loggedUser);
  if(state.profile && state.profile.lodge_id) url.searchParams.set('client_reference_id', state.profile.lodge_id);
  window.open(url.toString(), '_blank');
}

async function adminSaveRewardSettings(){
  const sighting = parseInt(document.getElementById('adm-sighting-reward').value, 10);
  const checkin = parseInt(document.getElementById('adm-checkin-reward').value, 10);
  const msg = document.getElementById('adm-reward-msg');
  if(isNaN(sighting) || isNaN(checkin) || sighting < 0 || checkin < 0){
    msg.style.color = 'var(--danger)'; msg.textContent = 'Digite valores válidos (0 ou mais).';
    return;
  }
  const { error } = await db.rpc('admin_update_reward_settings', { p_sighting_reward: sighting, p_checkin_reward: checkin });
  if(error){ msg.style.color = 'var(--danger)'; msg.textContent = error.message; return; }
  state.rewardSettings = { sighting, checkin };
  msg.style.color = 'var(--green)'; msg.textContent = 'Valores atualizados!';
  showToast(`Valores de ${currencyName()} atualizados.`);
}

async function adminCreateReservation(){
  const code = document.getElementById('adm-res-code').value.trim().toUpperCase();
  const checkin = document.getElementById('adm-res-checkin').value;
  const checkout = document.getElementById('adm-res-checkout').value;
  const msg = document.getElementById('adm-res-msg');
  if(!checkin || !checkout){
    msg.style.color = 'var(--danger)'; msg.textContent = 'Preencha as duas datas.';
    return;
  }
  const { error } = await db.rpc('admin_create_reservation', { p_code: code || null, p_checkin: checkin, p_checkout: checkout });
  if(error){ msg.style.color = 'var(--danger)'; msg.textContent = error.message; return; }
  msg.style.color = 'var(--green)'; msg.textContent = 'Reserva criada!';
  await loadAdminData();
  render();
  showToast(code ? `Código ${code} criado com sucesso.` : 'Reserva criada com código gerado automaticamente.');
}

async function adminSaveLodgeCode(){
  const btn = document.getElementById('adm-lodge-code-btn');
  const msg = document.getElementById('adm-lodge-code-msg');
  btn.disabled = true;
  const { data: code, error } = await db.rpc('admin_generate_shared_access_code');
  btn.disabled = false;
  if(error){ msg.style.color = 'var(--danger)'; msg.textContent = error.message; return; }
  msg.style.color = 'var(--green)'; msg.textContent = 'Código gerado!';

  // Atualiza a tela direto com o código que a função retornou — não
  // depende de outra consulta pra mostrar na hora.
  if(!state.lodgeFeatures) state.lodgeFeatures = {};
  state.lodgeFeatures.shared_access_code = code;

  // Também tenta atualizar o resto dos dados do plano em segundo plano
  // (mescla em vez de substituir, para nunca apagar o código que acabamos de gerar)
  db.from('lodge_plan_features').select('*').eq('lodge_id', state.profile.lodge_id).maybeSingle()
    .then(({ data: features })=>{
      if(features) state.lodgeFeatures = { ...features, shared_access_code: features.shared_access_code || code };
    });

  render();
  showToast(`Código de check-in gerado: ${code}`);
}

async function loadPendingForGuide(){
  const { data, error } = await db
    .from('sightings')
    .select('*')
    .eq('lodge_id', state.profile.lodge_id)
    .eq('status', 'pending')
    .order('created_at', { ascending:true });
  if(error){ console.error('guide pending', error.message); return; }
  const rows = data || [];
  const userIds = [...new Set(rows.map(r=>r.user_id))];
  let profilesById = {};
  if(userIds.length){
    const { data: profs } = await db.from('profiles').select('id, full_name').in('id', userIds);
    (profs||[]).forEach(p => { profilesById[p.id] = p.full_name; });
  }
  state.pendingGuideSightings = rows.map(r => ({
    id:r.id, user: esc(profilesById[r.user_id] || 'Hóspede'), loc: esc(state.profile && state.profile.lodge_name || 'Pousada'),
    date: new Date(r.created_at).toLocaleDateString('pt-BR') + ' às ' + new Date(r.created_at).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}),
    species: esc(r.species_text), desc: esc(r.description || ''), photo: r.photo_url,
    videoUrl: r.video_url, videoTrimStart: r.video_trim_start || 0, observedAt: r.observed_at || r.created_at,
    moderationStatus: r.moderation_status, moderationReason: esc(r.moderation_reason || ''),
    videoCheck: r.video_check, videoCheckStatus: r.video_check_status, videoTranscript: r.video_transcript,
    coords: r.location_lat != null ? {lat:r.location_lat, lng:r.location_lng} : null,
  }));
}

async function validateVoucher(){
  const input = document.getElementById('gd-voucher-code');
  const msg = document.getElementById('gd-voucher-msg');
  const btn = document.getElementById('gd-voucher-btn');
  const code = input.value.trim().toUpperCase();
  if(!code){ msg.style.color = 'var(--danger)'; msg.textContent = 'Digite o código do voucher.'; return; }

  btn.disabled = true; btn.textContent = 'Validando...';
  const { data, error } = await db.rpc('validate_redemption_code', { p_code: code });
  btn.disabled = false; btn.textContent = 'Validar voucher';

  if(error){ msg.style.color = 'var(--danger)'; msg.textContent = error.message; return; }

  if(data === false){
    msg.style.color = 'var(--amber)';
    msg.textContent = 'Este voucher já tinha sido usado anteriormente.';
    return;
  }

  msg.style.color = 'var(--green)';
  msg.textContent = 'Voucher validado com sucesso!';
  input.value = '';
  showToast(`Voucher ${code} confirmado.`);
}

async function guideDecision(sightingId, approve){
  const { error } = await db.rpc(approve ? 'approve_sighting' : 'reject_sighting', { p_sighting_id: sightingId });
  if(error){ console.error('guide decision', error.message); showToast('Erro: ' + error.message); return; }
  showToast(approve ? `Avistamento aprovado! Hóspede recebeu +${currencyLabel(state.rewardSettings.sighting)}.` : 'Avistamento rejeitado.');
  await loadPendingForGuide();
  render();
}

function handleVideoFile(e){

  clearVideoSelection();

  const probeVideo = document.createElement('video');
  probeVideo.preload = 'metadata';
  probeVideo.src = URL.createObjectURL(f);

    state.videoDuration = probeVideo.duration;
    if(state.videoDuration <= 30){

/* ---------- OTIMIZAÇÃO DE IMAGEM (miniatura + versão completa, WebP) ---------- */
const SUPPORTS_WEBP = (function(){
  const c = document.createElement('canvas');
  return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
})();

function resizeToCanvas(img, maxDim){
  let w = img.width, h = img.height;
  if(w > maxDim || h > maxDim){
    if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
    else { w = Math.round(w * maxDim / h); h = maxDim; }
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas;
}

function canvasToBlobAsync(canvas, quality){
  const type = SUPPORTS_WEBP ? 'image/webp' : 'image/jpeg';
  return new Promise(resolve=>{
    canvas.toBlob(blob=> resolve({ blob, type, ext: SUPPORTS_WEBP?'webp':'jpg' }), type, quality);
  });
}

async function buildPhotoAssets(img){
  // miniatura: usada no feed (a maioria das visualizações) — bem mais leve
  const thumbCanvas = resizeToCanvas(img, 480);
  const thumb = await canvasToBlobAsync(thumbCanvas, 0.72);
  // versão completa: usada ao abrir/compartilhar, e na validação do guia
  const fullCanvas = resizeToCanvas(img, 1280);
  const full = await canvasToBlobAsync(fullCanvas, 0.82);
  return { thumb, full };
}

/* Sugestão de espécie a partir da foto, usando a API pública e gratuita
   de identificação visual do iNaturalist (feita exatamente para isso).
   Se a chamada falhar por qualquer motivo (sem internet, API fora do
   ar, espécie não reconhecida), simplesmente não mostra sugestão —
   nunca bloqueia o envio do avistamento. */
async function suggestSpeciesFromPhoto(blob){
  try{
    const formData = new FormData();
    formData.append('image', blob, 'photo.jpg');
    const res = await fetch('https://api.inaturalist.org/v1/computervision/score_image', {
      method: 'POST',
      body: formData,
    });
    if(!res.ok) return null;
    const json = await res.json();
    const top = json.results && json.results[0];
    if(top && top.taxon && top.combined_score > 50){
      return {
        name: top.taxon.preferred_common_name || top.taxon.name,
        scientificName: top.taxon.name,
      };
    }
  }catch(err){
    console.error('species suggestion error', err);
  }
  return null;
}

function handleAvatarUpload(e){
  const f = e.target.files[0];
  if(!f) return;
  showToast('Enviando foto de perfil...');
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = async ()=>{
      const canvas = resizeToCanvas(img, 300);
      const { blob, type, ext } = await canvasToBlobAsync(canvas, 0.85);
      try{
        const path = `${state.session.user.id}/avatar_${Date.now()}.${ext}`;
        const { error: upErr } = await db.storage.from('user-avatars').upload(path, blob, { contentType: type, upsert: true });
        if(upErr){ showToast('Não foi possível enviar a foto: ' + upErr.message); return; }
        const url = db.storage.from('user-avatars').getPublicUrl(path).data.publicUrl;
        const { error: updErr } = await db.from('profiles').update({ avatar_url: url }).eq('id', state.session.user.id);
        if(updErr){ showToast('Não foi possível salvar a foto: ' + updErr.message); return; }
        state.profile.avatar_url = url;
        afterAvatarChanged(url);
        render();
        showToast('Foto de perfil atualizada!');
      }catch(err){
        console.error('avatar upload', err);
        showToast('Não foi possível enviar a foto de perfil.');
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}

async function uploadVideoBlob(blob){
  try{
    const ext = blob.type.includes('webm') ? 'webm' : (blob.type.includes('quicktime') ? 'mov' : 'mp4');
    const path = `${state.session.user.id}/${Date.now()}.${ext}`;
    const { error } = await db.storage.from('sighting-videos').upload(path, blob, { contentType: blob.type || 'video/webm' });
    if(error){ console.error('upload video', error.message); return null; }
    return db.storage.from('sighting-videos').getPublicUrl(path).data.publicUrl;
  }catch(err){
    console.error('upload video exception', err);
    return null;
  }
}

async function uploadPhotoAssets(assets){
  try{
    const base = `${state.session.user.id}/${Date.now()}`;
    const fullPath = `${base}.${assets.full.ext}`;
    const thumbPath = `${base}_thumb.${assets.thumb.ext}`;

    const [fullRes, thumbRes] = await Promise.all([
      db.storage.from('sighting-photos').upload(fullPath, assets.full.blob, { contentType: assets.full.type }),
      db.storage.from('sighting-photos').upload(thumbPath, assets.thumb.blob, { contentType: assets.thumb.type }),
    ]);
    if(fullRes.error){ console.error('upload full', fullRes.error.message); return null; }
    if(thumbRes.error){ console.error('upload thumb', thumbRes.error.message); }

    const fullUrl = db.storage.from('sighting-photos').getPublicUrl(fullPath).data.publicUrl;
    const thumbUrl = thumbRes.error ? fullUrl : db.storage.from('sighting-photos').getPublicUrl(thumbPath).data.publicUrl;
    return { photo_url: fullUrl, photo_thumb_url: thumbUrl };
  }catch(err){
    console.error('upload exception', err);
    return null;
  }
}

async function submitSighting(){
  const species = document.getElementById('mod-species').value.trim();
  const desc = document.getElementById('mod-desc').value.trim();
  if(!species){ document.getElementById('mod-species').style.borderColor='var(--danger)'; return; }

  if(!state.profile || !state.profile.lodge_id){
    state.modalOpen = false;
    render();
    showToast('Não foi possível identificar sua pousada. Saia e entre novamente, ou revalide o código da reserva no Check-in.');
    return;
  }

  // Captura o momento exato AGORA — antes de qualquer envio/upload demorado,
  // para o horário registrado ser sempre o do avistamento real, não o do envio.
  const observedAt = new Date().toISOString();

  const matchedSpecies = state.speciesCatalog.find(sp => sp.common_name.toLowerCase() === species.toLowerCase());
  const photoAssetsLocal = state.photoAssets;
  const videoBlobLocal = state.videoBlob;
  const videoTrimStartLocal = state.videoTrimStart || 0;
  let locationLocal = state.modalLocation;
  state.modalOpen = false;
  render();

  // Sem sinal: tenta capturar a localização agora (o GPS funciona sem
  // internet), mesmo que o hóspede não tenha tocado em "anexar localização".
  if(!state.online && !locationLocal && navigator.geolocation){
    locationLocal = await new Promise((resolve)=>{
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  const item = {
    type:'sighting', clientId: newClientId(), species, desc, photoAssetsLocal, videoBlobLocal, videoTrimStartLocal,
    locationLocal, observedAt, speciesId: matchedSpecies?matchedSpecies.id:null,
    lodgeId: state.profile.lodge_id, userId: state.session.user.id,
  };
  const horario = new Date(observedAt).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  if(!state.online){
    await queueAdd(item);
    render();
    showToast(`Sem conexão — avistamento guardado no aparelho às ${horario}${locationLocal?' com localização':''}. Ele é enviado sozinho quando o sinal voltar, mesmo se você fechar o app.`);
    track('sighting_queued_offline');
    return;
  }

  showToast('Enviando avistamento...');
  const res = await sendSightingItem(item);
  if(res.ok){
    await loadSightings();
    render();
    showToast('Avistamento enviado para a equipe da pousada validar. Você será avisado quando aprovar.');
    track('sighting_submitted', { has_photo: !!photoAssetsLocal, has_video: !!videoBlobLocal });
    return;
  }
  if(res.retryable){
    await queueAdd(item);
    render();
    showToast(`O sinal caiu durante o envio. O avistamento ficou guardado no aparelho (horário real: ${horario}) e será reenviado sozinho.`);
    track('sighting_queued_weak_signal');
    return;
  }
  showToast('Não foi possível enviar o avistamento: ' + res.error);
}

/* Envia um avistamento (fotos, vídeo e registro). Usado tanto no envio
   normal quanto no reenvio da fila. Devolve:
     { ok:true }                       enviado (ou já tinha sido antes)
     { ok:false, retryable:true }      falha de rede — guardar e tentar depois
     { ok:false, retryable:false, error } recusado pelo servidor (ex.: limite) */
async function sendSightingItem(item){
  try{
    let photo_url = null, photo_thumb_url = null;
    if(item.photoAssetsLocal){
      const uploaded = await uploadPhotoAssets(item.photoAssetsLocal);
      if(!uploaded) return { ok:false, retryable:true };
      photo_url = uploaded.photo_url; photo_thumb_url = uploaded.photo_thumb_url;
    }
    let video_url = null;
    if(item.videoBlobLocal){
      video_url = await uploadVideoBlob(item.videoBlobLocal);
      if(!video_url) return { ok:false, retryable:true };
    }
    const { error } = await db.from('sightings').insert({
      client_id: item.clientId || null,
      lodge_id: item.lodgeId || state.profile.lodge_id,
      user_id: item.userId || state.session.user.id,
      species_id: item.speciesId,
      species_text: item.species,
      description: item.desc || null,
      photo_url, photo_thumb_url, video_url,
      video_trim_start: video_url ? (item.videoTrimStartLocal || 0) : null,
      observed_at: item.observedAt || new Date().toISOString(),
      has_photo: !!photo_url,
      location_lat: item.locationLocal ? item.locationLocal.lat : null,
      location_lng: item.locationLocal ? item.locationLocal.lng : null,
    });
    if(!error) return { ok:true };
    if(error.code === '23505') return { ok:true }; // já tinha chegado antes (reenvio após queda)
    if(isNetworkError(error.message)) return { ok:false, retryable:true };
    reportError(new Error('sighting insert: ' + error.message));
    return { ok:false, retryable:false, error: error.message };
  }catch(err){
    return { ok:false, retryable:true };
  }
}

function isNetworkError(msg){
  return /fetch|network|timeout|offline|load failed|ECONN|503|502|504/i.test(String(msg||''));
}

function newClientId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
}

function isStaffProfile(){

async function loadMfaStatus(){
  try{
    const { data } = await db.auth.mfa.listFactors();
    state.mfaFactors = (data && data.totp || []).filter(f => f.status === 'verified');
    const aal = await db.auth.mfa.getAuthenticatorAssuranceLevel();
    state.mfaLevel = aal.data ? aal.data.currentLevel : null;
    state.mfaNextLevel = aal.data ? aal.data.nextLevel : null;
  }catch(_){ state.mfaFactors = []; }
}
async function checkMfaGate(){
  await loadMfaStatus();
  if(state.mfaNextLevel === 'aal2' && state.mfaLevel !== 'aal2') return 'challenge';
  const required = state.settings && state.settings.staff_mfa_required === 'true';
  if(required && isStaffProfile() && state.mfaLevel !== 'aal2') return 'enroll';
  return null;
}
function mfaView(){
  const mode = state.mfaGate;
  if(mode === 'challenge'){

      ${forced ? `<button class="btn-ghost" onclick="logout()">Sair</button>` : `<button class="btn-ghost" onclick="cancelMfaEnroll()">Cancelar</button>`}

async function startMfaEnroll(){
  const btn = document.getElementById('mfa-start-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando...'; }
  // remove tentativas antigas não concluídas
  try{
    const { data } = await db.auth.mfa.listFactors();
    for(const f of (data && data.all || [])){ if(f.status !== 'verified') await db.auth.mfa.unenroll({ factorId: f.id }); }
  }catch(_){}
  const { data, error } = await db.auth.mfa.enroll({ factorType:'totp', friendlyName:'EcoSafari Go ' + new Date().toISOString().slice(0,10) });
  if(error){ showToast('Não foi possível iniciar: ' + error.message + ' (confira se o MFA está habilitado no Supabase)'); if(btn){ btn.disabled=false; btn.textContent='Gerar QR Code'; } return; }
  state.mfaEnroll = { id: data.id, qr: data.totp.qr_code, secret: data.totp.secret };
  render();
}
async function confirmMfaEnroll(){
  const code = (document.getElementById('mfa-code').value || '').trim();
  const msg = document.getElementById('mfa-msg');
  if(!/^\d{6}$/.test(code)){ msg.textContent = 'Digite os 6 números do app autenticador.'; return; }
  const { error } = await db.auth.mfa.challengeAndVerify({ factorId: state.mfaEnroll.id, code });
  if(error){ msg.textContent = 'Código incorreto ou expirado. Tente o próximo código.'; return; }
  state.mfaEnroll = null;
  const wasForced = state.mfaGate === 'enroll';
  state.mfaGate = null;
  await loadMfaStatus();
  showToast('Verificação em duas etapas ativada.');
  track('mfa_enabled');
  if(wasForced) await finishLogin(); else { state.screen = 'settings'; render(); }
}
async function verifyMfaLogin(){
  const code = (document.getElementById('mfa-code').value || '').trim();
  const msg = document.getElementById('mfa-msg');
  if(!/^\d{6}$/.test(code)){ msg.textContent = 'Digite os 6 números do app autenticador.'; return; }
  const { data } = await db.auth.mfa.listFactors();
  const factor = (data && data.totp || []).find(f => f.status === 'verified');
  if(!factor){ msg.textContent = 'Nenhum autenticador encontrado nesta conta.'; return; }
  const { error } = await db.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
  if(error){ msg.textContent = 'Código incorreto ou expirado. Tente o próximo código.'; return; }
  state.mfaGate = null;
  await loadMfaStatus();
  await finishLogin();
}
function openMfaEnroll(){ state.mfaGate = 'voluntary'; state.mfaEnroll = null; render(); }
function cancelMfaEnroll(){ state.mfaGate = null; state.mfaEnroll = null; state.screen = 'settings'; render(); }
async function disableMfa(){
  if(state.settings && state.settings.staff_mfa_required === 'true' && isStaffProfile()){
    showToast('Contas da equipe precisam manter a verificação em duas etapas.'); return;
  }
  if(!confirm('Desativar a verificação em duas etapas? Sua conta fica protegida só pela senha.')) return;
  for(const f of (state.mfaFactors || [])){
    const { error } = await db.auth.mfa.unenroll({ factorId: f.id });
    if(error){ showToast('Para desativar, saia e entre de novo usando o código do autenticador. (' + error.message + ')'); return; }
  }
  await loadMfaStatus(); render(); showToast('Verificação em duas etapas desativada.');
}

let _leafletLoading = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(_leafletLoading) return _leafletLoading;
  _leafletLoading = new Promise((resolve, reject)=>{
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; js.onload = resolve; js.onerror = reject; document.head.appendChild(js);
  });
  return _leafletLoading;
}
async function initSightingsMap(){
  const el = document.getElementById('sightings-map');
  if(!el) return;
  try{ await loadLeaflet(); }catch(_){ el.innerHTML = '<div style="padding:30px; text-align:center; color:var(--text-dim); font-size:12px;">Mapa indisponível sem internet.</div>'; return; }
  if(!document.getElementById('sightings-map')) return;
  const pts = state.sightings.filter(s => s.coords && s.status === 'approved');
  const map = L.map(el, { zoomControl:true, attributionControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution:'© OpenStreetMap' }).addTo(map);
  const bounds = [];
  pts.forEach(s=>{
    const ageH = (Date.now() - new Date(s.observedAt || s.createdAt || Date.now()).getTime()) / 3600000;
    const color = ageH <= 2 ? '#1fdf9a' : ageH <= 24 ? '#f5b942' : '#8b9994';
    const m = L.circleMarker([s.coords.lat, s.coords.lng], { radius: 9, color:'#0a0e0c', weight:2, fillColor: color, fillOpacity: 0.95 }).addTo(map);
    const dir = `https://www.google.com/maps/dir/?api=1&destination=${s.coords.lat},${s.coords.lng}`;
    m.bindPopup(`<b>${s.species}</b><br>${timeAgo(s.observedAt)} · ${s.user}<br><a href="${dir}" target="_blank">Como chegar</a>`);
    bounds.push([s.coords.lat, s.coords.lng]);
  });
  const fit = ()=>{ map.invalidateSize(); if(bounds.length) map.fitBounds(bounds, { padding:[30,30], maxZoom: 14 }); else map.setView([-16.5, -56.5], 7); };
  fit(); setTimeout(fit, 250); // Pantanal como padrão quando não há pontos
}

/* ---------- Notificações push no app instalado (Web Push) ---------- */
function urlBase64ToUint8Array(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(ch => ch.charCodeAt(0)));
}
async function refreshWebPushState(){
  try{
    if(!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
    state.webPushOn = !!sub && Notification.permission === 'granted';
  }catch(_){}
}
async function enableWebPush(){
  if(!CONFIG.webPushPublicKey){ showToast('As notificações push ainda não foram configuradas pela equipe EcoSafari Go.'); return; }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('Este navegador não suporta notificações. No iPhone, adicione o app à Tela de Início primeiro.'); return;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ showToast('Permissão negada. Você pode liberar nas configurações do navegador.'); return; }
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(CONFIG.webPushPublicKey) });
    const j = sub.toJSON();
    const { error } = await db.from('web_push_subscriptions').upsert({
      user_id: state.session.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0,300),
    }, { onConflict:'endpoint' });
    if(error) throw error;
    state.webPushOn = true; render();
    showToast('Pronto! Você vai receber alertas de avistamentos mesmo com o app fechado.');
    track('web_push_enabled');
  }catch(err){ reportError(err); showToast('Não foi possível ativar as notificações: ' + (err.message || err)); }
}

/* =====================================================================
   FILA OFFLINE (guardada no próprio aparelho)
   ---------------------------------------------------------------------
   Os avistamentos feitos sem sinal ficam gravados no IndexedDB do
   aparelho — com foto, vídeo, localização e o horário real. Não se
   perdem se o app for fechado ou o celular reiniciar. O reenvio é
   automático: quando o sinal volta, quando o app é aberto, quando ele
   volta para a tela, e a cada minuto enquanto houver algo pendente.
   ===================================================================== */
const QUEUE_DB = 'ecosafari-offline', QUEUE_STORE = 'queue';
let _queueDbPromise = null;
function queueDb(){
  if(_queueDbPromise) return _queueDbPromise;
  _queueDbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(QUEUE_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(QUEUE_STORE, { keyPath:'qid', autoIncrement:true }); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _queueDbPromise;
}
function queueTx(mode, fn){
  return queueDb().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(QUEUE_STORE, mode);
    const out = fn(tx.objectStore(QUEUE_STORE));
    tx.oncomplete = ()=> resolve(out && out.result !== undefined ? out.result : undefined);
    tx.onerror = ()=> reject(tx.error);
  }));
}
async function queueAdd(item){
  item.queuedAt = new Date().toISOString();
  try{ await queueTx('readwrite', st => st.add(item)); }
  catch(err){ reportError(err); }
  await queueRefreshState();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
}
async function queueAll(){
  try{ return await queueTx('readonly', st => st.getAll()) || []; }
  catch(_){ return []; }
}
async function queueRemove(qid){
  try{ await queueTx('readwrite', st => st.delete(qid)); }catch(err){ reportError(err); }
}
async function queueRefreshState(){
  state.offlineQueue = await queueAll();
}

let _syncing = false;
async function syncQueue(){
  if(_syncing || !state.online || !state.session || !state.profile) return;
  const items = await queueAll();
  state.offlineQueue = items;
  if(items.length === 0) return;
  _syncing = true;
  let sent = 0, failed = [];
  try{
    for(const item of items){
      // Só reenvia itens da conta que está logada agora
      if(item.userId && item.userId !== state.session.user.id) continue;
      if(item.type === 'sighting'){
        const res = await sendSightingItem(item);
        if(res.ok){ await queueRemove(item.qid); sent++; }
        else if(res.retryable){ break; } // sinal caiu de novo: tenta mais tarde
        else { await queueRemove(item.qid); failed.push(item.species + ': ' + res.error); }
      } else if(item.type === 'checkin'){
        await queueRemove(item.qid);
        if(navigator.geolocation){
          navigator.geolocation.getCurrentPosition(pos=>{
            completeCheckin(pos.coords.latitude, pos.coords.longitude);
          }, null, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
        }
        sent++;
      }
    }
  } finally {
    _syncing = false;
    await queueRefreshState();
  }
  if(sent > 0){
    await loadSightings();
    await loadWallet();
    render();
    showToast(`Conexão restabelecida — ${sent} item(ns) enviado(s) com o horário real do avistamento.`);
    track('offline_queue_synced', { count: sent });
  }
  if(failed.length){
    showToast('Alguns avistamentos guardados foram recusados pelo servidor: ' + failed.join(' · '));
  }
}

window.addEventListener('offline', ()=>{ state.online = false; render(); });
