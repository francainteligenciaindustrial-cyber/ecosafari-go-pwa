/* ---------- utilidades ---------- */
function appBaseUrl(){ return location.origin + location.pathname.replace(/index\.html$/, ''); }
function profileUrl(username){ return appBaseUrl() + '?u=' + encodeURIComponent(username); }
function safeHttpUrl(u){
  try{ const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; }catch(_){ return ''; }
}
function linkLabel(u){
  try{ const x = new URL(u); return (x.hostname.replace(/^www\./, '') + (x.pathname !== '/' ? x.pathname : '')).replace(/\/$/, ''); }catch(_){ return u; }
}
function fmtCount(n){
  n = Number(n) || 0;
  if(n >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '') + ' mi';
  if(n >= 1e4) return Math.round(n / 1000) + ' mil';
  if(n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + ' mil';
  return String(n);
}
function speciesShort(s){ return String(s || '').split(' (')[0]; }
function initialsOf(name){ return String(name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?'; }
function pfAvatarInner(card){
  return card.avatar_url ? `<img src="${esc(card.avatar_url)}" alt="">` : esc(initialsOf(card.full_name));
}

/* ---------- carregamento ---------- */
async function loadSocialProfile(userId, opts){
  opts = opts || {};
  const same = state.pf && state.pf.userId === userId;
  if(!same) state.pf = { userId, card:null, posts:[], tab:'posts', filter:null, loading:true, error:false, more:false, anon:!!opts.anon };
  else { state.pf.loading = true; state.pf.error = false; state.pf.anon = !!opts.anon; }
  try{
    const [c, p] = await Promise.all([
      db.rpc('get_profile_card', { p_user_id: userId }),
      db.rpc('get_profile_posts', { p_user_id: userId, p_limit: 60, p_offset: 0 }),
    ]);
    if(c.error) throw c.error;
    if(!state.pf || state.pf.userId !== userId) return;
    state.pf.card = c.data;
    state.pf.posts = p.data || [];
    state.pf.more = (p.data || []).length === 60;
    if(!c.data) state.pf.error = 'notfound';
  }catch(err){
    reportError(err);
    if(state.pf && state.pf.userId === userId) state.pf.error = true;
  }
  if(state.pf && state.pf.userId === userId){ state.pf.loading = false; render(); }
}
async function loadMorePosts(){
  const pf = state.pf; if(!pf || !pf.card) return;
  const { data } = await db.rpc('get_profile_posts', { p_user_id: pf.userId, p_limit: 60, p_offset: pf.posts.length });
  pf.posts = pf.posts.concat(data || []);
  pf.more = (data || []).length === 60;
  render();
}
function openMyProfile(){
  state.adminMode = false; state.guideMode = false;
  state.screen = 'perfil';
  if(state.session) loadSocialProfile(state.session.user.id);
  render();
}
function openUserProfile(userId){
  if(state.session && userId === state.session.user.id){ openMyProfile(); return; }
  state.prevScreen = state.screen === 'userProfile' ? (state.prevScreen || 'avistamentos') : state.screen;
  state.screen = 'userProfile';
  state.pfList = null; state.pfSearch = null;
  loadSocialProfile(userId);
  render();
}
function backFromProfile(){
  state.pf = state.pf && state.pf.card && state.pf.card.is_me ? state.pf : null;
  const back = state.prevScreen && state.prevScreen !== 'userProfile' ? state.prevScreen : 'avistamentos';
  state.screen = back; render();
}
async function openUserByUsername(username){
  const { data } = await db.rpc('get_profile_card', { p_username: username });
  if(!data){ showToast(pfT('profile_not_found')); return; }
  openUserProfile(data.id);
}

function readDeepLink(){
  try{
    const u = new URLSearchParams(location.search).get('u');
    if(u && /^[A-Za-z0-9._]{3,30}$/.test(u)) state.deepLinkUser = u.toLowerCase();
  }catch(_){}
}
function clearDeepLinkFromUrl(){
  try{ const url = new URL(location.href); url.searchParams.delete('u'); history.replaceState(null, '', url.pathname + (url.search || '') + url.hash); }catch(_){}
}
async function loadPublicProfile(username){
  state.pf = { userId:null, card:null, posts:[], tab:'posts', filter:null, loading:true, error:false, more:false, anon:true };
  render();
  try{
    const { data: card, error } = await db.rpc('get_profile_card', { p_username: username });
    if(error) throw error;
    if(!card){ state.pf.error = 'notfound'; state.pf.loading = false; render(); return; }
    state.pf.userId = card.id; state.pf.card = card;
    const { data: posts } = await db.rpc('get_profile_posts', { p_user_id: card.id, p_limit: 60, p_offset: 0 });
    state.pf.posts = posts || [];
    state.pf.more = (posts || []).length === 60;
  }catch(err){ reportError(err); state.pf.error = true; }
  state.pf.loading = false; render();
}

/* ---------- seguir / compartilhar ---------- */
async function toggleFollowProfile(){
  const pf = state.pf; if(!pf || !pf.card || pf.card.is_me) return;
  const c = pf.card;
  const was = !!c.is_following;
  c.is_following = !was; c.followers = Math.max(0, (c.followers || 0) + (was ? -1 : 1));
  render();
  const { data, error } = await db.rpc('toggle_follow', { p_user_id: c.id });
  if(error){
    c.is_following = was; c.followers = Math.max(0, c.followers + (was ? 1 : -1));
    render(); showToast(error.message); return;
  }
  track(data ? 'follow' : 'unfollow');
}
async function shareProfile(){
  const c = state.pf && state.pf.card; if(!c || !c.username) return;
  const url = profileUrl(c.username);
  try{
    if(navigator.share){ await navigator.share({ title: (c.full_name || 'EcoSafari Go') + ' (@' + c.username + ')', text: pfT('share_text'), url }); track('profile_shared'); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  copyProfileLink(url);
}
async function copyProfileLink(url){
  try{ await navigator.clipboard.writeText(url); showToast(pfT('link_copied')); }
  catch(_){ window.prompt(pfT('your_link'), url); }
}

async function saveProfileEdit(){
  const g = id => document.getElementById(id);
  const msg = g('pe-msg'), btn = g('pe-save');
  msg.textContent = '';
  btn.disabled = true; btn.textContent = pfT('saving');
  const { data, error } = await db.rpc('update_my_profile', {
    p_full_name: g('pe-name').value, p_username: g('pe-user').value, p_bio: g('pe-bio').value,
    p_link_url: g('pe-link').value, p_profile_public: g('pe-public').checked,
  });
  btn.disabled = false; btn.textContent = pfT('save');
  if(error){ msg.textContent = error.message; return; }
  if(state.pf && state.pf.card) state.pf.card = Object.assign({}, state.pf.card, data);
  if(state.profile) Object.assign(state.profile, { full_name: data.full_name, username: data.username, bio: data.bio, link_url: data.link_url, profile_public: data.profile_public });
  state.pfEdit = null;
  render(); showToast(pfT('saved')); track('profile_edited');
}

/* ---------- foto de capa ---------- */
function cropToCanvas(img, w, h){
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const scale = Math.max(w / img.width, h / img.height);
  const sw = w / scale, sh = h / scale;
  canvas.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
  return canvas;
}
function handleCoverUpload(e){
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  stashEditDraft();
  showToast(pfT('uploading'));
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = async () => {
      try{
        const canvas = cropToCanvas(img, 1200, 480);
        const { blob, type, ext } = await canvasToBlobAsync(canvas, 0.85);
        const path = `${state.session.user.id}/cover_${Date.now()}.${ext}`;
        const { error: upErr } = await db.storage.from('user-covers').upload(path, blob, { contentType: type, upsert: true });
        if(upErr){ showToast(upErr.message); return; }
        const url = db.storage.from('user-covers').getPublicUrl(path).data.publicUrl;
        const { error: updErr } = await db.from('profiles').update({ cover_url: url }).eq('id', state.session.user.id);
        if(updErr){ showToast(updErr.message); return; }
        if(state.pf && state.pf.card) state.pf.card.cover_url = url;
        if(state.profile) state.profile.cover_url = url;
        render(); showToast(pfT('cover_saved'));
      }catch(err){ reportError(err); showToast(pfT('error_load')); }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}
async function removeCover(){
  const { error } = await db.from('profiles').update({ cover_url: null }).eq('id', state.session.user.id);
  if(error){ showToast(error.message); return; }
  if(state.pf && state.pf.card) state.pf.card.cover_url = null;
  render(); showToast(pfT('cover_removed'));
}

async function openFollowList(kind){
  const pf = state.pf; if(!pf || !pf.card || pf.card.is_private) return;
  if(pf.anon){ leavePublicProfile(); return; }
  state.pfList = { kind, rows: [], loading: true, userId: pf.userId };
  render();
  const { data, error } = await db.rpc('list_follows', { p_user_id: pf.userId, p_kind: kind, p_limit: 100, p_offset: 0 });
  if(!state.pfList) return;
  state.pfList.loading = false; state.pfList.rows = error ? [] : (data || []);
  render();
}
function closeFollowList(){ state.pfList = null; render(); }
function followRowsHTML(rows, meId){
  if(!rows.length) return `<div class="pf-empty" style="padding:24px;">${pfT('no_followers')}</div>`;
  return rows.map(r => `
    <div class="pf-row">
      <div class="pf-mini" onclick="closePfModals(); openUserProfile('${esc(r.id)}')">${r.avatar_url ? `<img src="${esc(r.avatar_url)}" alt="">` : esc(initialsOf(r.full_name))}</div>
      <div class="pf-who" onclick="closePfModals(); openUserProfile('${esc(r.id)}')"><b>${esc(r.full_name || '')}</b><span>@${esc(r.username || '')}</span></div>
      ${r.id !== meId ? `<button class="pf-btn ${r.i_follow ? '' : 'primary'}" onclick="toggleFollowRow('${esc(r.id)}')">${r.i_follow ? pfT('following_btn') : pfT('follow')}</button>` : ''}
    </div>`).join('');
}
async function toggleFollowRow(userId){
  const lists = [state.pfList && state.pfList.rows, state.pfSearch && state.pfSearch.rows].filter(Boolean);
  let row = null; lists.forEach(l => l.forEach(r => { if(r.id === userId) row = r; }));
  if(!row) return;
  const was = !!(row.i_follow !== undefined ? row.i_follow : row.following);
  row.i_follow = !was; row.following = !was;
  refreshPfModalLists();
  const { error } = await db.rpc('toggle_follow', { p_user_id: userId });
  if(error){ row.i_follow = was; row.following = was; refreshPfModalLists(); showToast(error.message); }
}
function refreshPfModalLists(){
  const me = state.session && state.session.user.id;
  const a = document.getElementById('pf-list-body'); if(a && state.pfList) a.innerHTML = followRowsHTML(state.pfList.rows, me);
  const b = document.getElementById('pf-search-results'); if(b && state.pfSearch) b.innerHTML = searchRowsHTML();
}
function closePfModals(){ state.pfList = null; state.pfSearch = null; state.pfView = null; render(); }
function followListModalHTML(){
  const l = state.pfList; if(!l) return '';
  return `
    <div class="modal-overlay open" style="z-index:60;" onclick="if(event.target===this) closeFollowList()">
      <div class="modal pf-sheet" style="max-height:82dvh; overflow-y:auto;">
        <h3>${l.kind === 'followers' ? pfT('followers_title') : pfT('following_title')}</h3>
        <div id="pf-list-body">${l.loading ? loadingView() : followRowsHTML(l.rows, state.session && state.session.user.id)}</div>
        <button class="btn-ghost" onclick="closeFollowList()">${pfT('cancel')}</button>
      </div>
    </div>`;
}

/* ---------- buscar pessoas ---------- */
let _pfSearchTimer = null;
function openSearchPeople(){ state.pfSearch = { q:'', rows:[] }; render(); setTimeout(() => { const i = document.getElementById('pf-search-input'); if(i) i.focus(); }, 50); }
function closeSearchPeople(){ state.pfSearch = null; render(); }
function searchRowsHTML(){
  const s = state.pfSearch; if(!s) return '';
  if(s.q.trim().length < 2) return '';
  if(s.loading) return `<div class="pf-empty" style="padding:18px;">${pfT('loading')}</div>`;
  if(!s.rows.length) return `<div class="pf-empty" style="padding:18px;">${pfT('no_results')}</div>`;
  return followRowsHTML(s.rows.map(r => Object.assign({ i_follow: !!r.following }, r)), state.session && state.session.user.id);
}
function onSearchPeople(v){
  if(!state.pfSearch) return;
  state.pfSearch.q = v;
  clearTimeout(_pfSearchTimer);
  if(v.trim().length < 2){ state.pfSearch.rows = []; refreshPfModalLists(); return; }
  _pfSearchTimer = setTimeout(async () => {
    state.pfSearch.loading = true; refreshPfModalLists();
    const { data } = await db.rpc('search_profiles', { p_q: v });
    if(!state.pfSearch || state.pfSearch.q !== v) return;
    state.pfSearch.loading = false; state.pfSearch.rows = data || [];
    refreshPfModalLists();
  }, 300);
}
function searchModalHTML(){
  if(!state.pfSearch) return '';
  return `
    <div class="modal-overlay open" style="z-index:60;" onclick="if(event.target===this) closeSearchPeople()">
      <div class="modal pf-sheet" style="max-height:82dvh; overflow-y:auto;">
        <h3>${pfT('search_people')}</h3>
        <div class="field"><input id="pf-search-input" placeholder="${esc(pfT('search_ph'))}" oninput="onSearchPeople(this.value)" autocapitalize="none" autocorrect="off" value="${esc(state.pfSearch.q)}"></div>
        <div id="pf-search-results">${searchRowsHTML()}</div>
        <button class="btn-ghost" onclick="closeSearchPeople()">${pfT('cancel')}</button>
      </div>
    </div>`;
}
